<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantLab · Monitor de estrategias</title>
<style>
:root{color-scheme:dark;--bg:#06100d;--panel:#0c1915;--panel2:#10221c;--line:#25443a;--text:#eef8f4;--muted:#8da79e;--mint:#4ee0a1;--amber:#ffc857;--red:#ff727f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 86% -8%,#174334 0,transparent 38%),var(--bg);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1540px;margin:auto;padding:26px 22px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:20px}.brand small{color:var(--mint);letter-spacing:.16em}.brand h1{font:750 30px system-ui;margin:4px 0 0}.right{display:flex;align-items:center;gap:20px}.tabs{display:flex;background:#081410;border:1px solid var(--line);padding:4px;border-radius:12px}.tab{border:0;background:transparent;color:var(--muted);font:650 14px system-ui;padding:10px 17px;border-radius:8px;cursor:pointer}.tab.active{background:var(--mint);color:#062117}.live{color:var(--mint);white-space:nowrap}
.activity,.notice{display:flex;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:14px;background:#0b1814}.notice{border-color:#5b491c;color:var(--amber);background:#221d0e}.phase{color:var(--mint);font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 3;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0}.half{grid-column:span 6}.full{grid-column:1/-1}.metric{font:730 25px system-ui;margin-top:6px}.label,.muted{color:var(--muted)}.good{color:var(--mint)}.bad{color:var(--red)}.amber{color:var(--amber)}h2{font:680 16px system-ui;margin:0 0 14px}
.timeline{position:relative;height:12px;border-radius:99px;background:#1c302a;margin:28px 2px 8px}.timeline-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#36bd87,var(--mint));box-shadow:0 0 18px #4ee0a155}.timeline-dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px;border:3px solid var(--panel);background:var(--mint);border-radius:50%}.timeline-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.timeline-now{text-align:center;color:var(--mint);margin-top:10px}.progress-meta{display:flex;justify-content:space-between;gap:15px}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#c1d9d1;font-size:12px;max-height:330px;overflow:auto}.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #20362f}th{position:sticky;top:0;background:#14261f;color:var(--muted);font-weight:500;z-index:1}th:first-child,td:first-child{text-align:left}.pill{display:inline-block;border:1px solid var(--line);padding:4px 8px;border-radius:99px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:34px}.badge{font-size:11px;padding:4px 8px;border-radius:99px;border:1px solid var(--line);margin-left:8px}.validated{color:var(--mint)}.provisional{color:var(--amber)}canvas{width:100%;height:170px}.hidden{display:none}
@media(max-width:980px){header{align-items:flex-start}.right{align-items:flex-end;flex-direction:column}.card,.half{grid-column:span 6}}@media(max-width:680px){main{padding:18px 12px 60px}header,.activity{display:block}.right{align-items:stretch;margin-top:16px}.tabs{display:grid;grid-template-columns:1fr 1fr}.live{margin-top:10px}.card,.half{grid-column:1/-1}.activity div:last-child{margin-top:6px}.metric{font-size:22px}}
</style></head><body><main>
<header><div class="brand"><small>FASE 1 HISTÓRICA → FASE 2 FORWARD 2026 · LONG-ONLY</small><h1>Strategy Monitor</h1></div><div class="right"><nav class="tabs"><button id="currentTab" class="tab active">Estrategia en curso</button><button id="bestTab" class="tab">Mejor forward 2026</button></nav><div id="live" class="live">● conectando</div></div></header>
<div id="activity"></div><div id="notice"></div><section id="app" class="grid"></section>
</main><script>
let data=null,view='current';
const money=v=>v==null?'—':new Intl.NumberFormat('es-ES',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v),pct=v=>v==null?'—':(100*Number(v)).toFixed(2)+'%',num=v=>v==null?'—':new Intl.NumberFormat('es-ES').format(v),cls=v=>v>0?'good':v<0?'bad':'',duration=s=>s==null?'—':s<86400?(s/3600).toFixed(1)+' h':(s/86400).toFixed(1)+' d',date=v=>v?new Date(v).toLocaleDateString('es-ES'):'—';
const metric=(label,value,kind='')=>`<article class="card"><div class="label">${label}</div><div class="metric ${kind}">${value}</div></article>`;
function timeline(run){if(!run)return `<article class="card full"><h2>Línea temporal de evaluación</h2><div class="empty">Preparando datos para iniciar la simulación</div></article>`;const forward=String(run.status).startsWith('FORWARD'),aborted=String(run.status).includes('ABORTED'),start=Date.parse(run.period_start),end=Date.parse(run.period_end),now=Date.parse(run.current_date||run.period_start),progress=Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))),title=forward?'Fase 2 · Forward testing 2026':'Fase 1 · Backtesting histórico',endLabel=forward?'Objetivo · '+date(run.period_end):'Corte estricto · 01/01/2026',stateClass=aborted?'bad':run.status==='BACKTESTING'||run.status==='FORWARD_TESTING'?'amber':'good';return `<article class="card full"><div class="progress-meta"><h2>${title}</h2><span class="${stateClass}">${run.status} · ${run.processed_days}/${run.total_days} días</span></div><div class="timeline"><div class="timeline-fill" style="width:${progress}%"></div><div class="timeline-dot" style="left:${progress}%"></div></div><div class="timeline-labels"><span>${date(run.period_start)}</span><span>${endLabel}</span></div><div class="timeline-now ${aborted?'bad':''}">${aborted?'CANCELADA POR DRAWDOWN · ':''}Fecha simulada: ${date(run.current_date)}</div></article>`}
function assets(items){return (items||[]).map(x=>`<tr><td>${x.symbol}</td><td>${money(x.capital_deployed)}</td><td>${money(x.peak_capital_at_risk)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.return_on_deployed)}">${pct(x.return_on_deployed)}</td><td>${x.trades}</td><td>${pct(x.win_rate)}</td><td class="${x.capital_preserved?'good':'bad'}">${x.capital_preserved?'SÍ':'NO'}</td></tr>`).join('')}
function trades(items){return (items||[]).map(x=>`<tr><td>${x.symbol} #${x.sequence}</td><td>${date(x.entry_time)}</td><td>${date(x.exit_time)}</td><td>${duration(x.duration_seconds)}</td><td>${money(x.invested_capital)}</td><td>${Number(x.entry_price).toFixed(6)}</td><td>${Number(x.exit_price).toFixed(6)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</td><td><span class="pill">${x.exit_reason}</span></td></tr>`).join('')}
function chart(points){setTimeout(()=>{const c=document.getElementById('equityChart');if(!c||!points?.length)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const values=points.map(p=>p.equity),lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1;x.strokeStyle='#4ee0a1';x.lineWidth=2;x.beginPath();values.forEach((v,i)=>{const px=i/(values.length-1||1)*w,py=h-8-(v-lo)/range*(h-16);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()},0)}
function render(){if(!data)return;const s=view==='current'?data.current_strategy:data.best_strategy,r=s?.backtest,e=s?.experiment;document.getElementById('currentTab').classList.toggle('active',view==='current');document.getElementById('bestTab').classList.toggle('active',view==='best');document.getElementById('notice').innerHTML=view==='best'&&s&&!s.validated?`<div class="notice">Esta es la mejor estrategia provisional. Aún no está promovida ni autorizada para la simulación forward de 2026.</div>`:'';if(!s){document.getElementById('app').innerHTML='<article class="card full"><div class="empty">Todavía no hay una estrategia disponible</div></article>';return}const badge=s.validated?'<span class="badge validated">VALIDADA</span>':'<span class="badge provisional">PROVISIONAL</span>';document.getElementById('app').innerHTML=timeline(r)+metric('Estrategia',s.label+badge)+metric('Capital inicial',money(r?.initial_capital))+metric('Equity',money(r?.current_equity),cls((r?.current_equity||0)-(r?.initial_capital||0)))+metric('Beneficio neto',money(r?.net_profit),cls(r?.net_profit))+metric('Retorno',pct(r?.return_pct),cls(r?.return_pct))+metric('Máximo drawdown',pct(r?.max_drawdown),'bad')+metric('Operaciones',num(r?.trades))+metric('Win rate',pct(r?.win_rate))+metric('Criptos disponibles',num(r?.assets_available))+metric('Criptos operadas',num(r?.assets_traded))+metric('Efectivo',money(r?.cash))+metric('Posiciones abiertas',num(r?.open_positions))+`<article class="card full"><h2>Curva de equity de la cartera</h2>${s.equity_curve?.length?'<canvas id="equityChart"></canvas>':'<div class="empty">La curva aparecerá al avanzar el backtest</div>'}</article><article class="card half"><h2>Criterios de entrada y salida</h2><pre>${JSON.stringify({family:s.definition.family,signal:s.definition.signal,parameters:e?.parameters},null,2)}</pre></article><article class="card half"><h2>Ejecución y money management dinámico</h2><pre>${JSON.stringify({execution:s.definition.execution,money_management:s.definition.money_management,portfolio_policy:data.current_strategy?.definition?.money_management},null,2)}</pre></article><article class="card full"><h2>Resultado por criptomoneda · ${s.assets?.length||0} activos</h2>${s.assets?.length?`<div class="table-wrap"><table><thead><tr><th>Cripto</th><th>Capital desplegado</th><th>Máx. en riesgo</th><th>Profit</th><th>Retorno/desplegado</th><th>Trades</th><th>Win rate</th><th>PnL ≥ 0</th></tr></thead><tbody>${assets(s.assets)}</tbody></table></div>`:'<div class="empty">Aún no hay resultados por activo</div>'}</article><article class="card full"><h2>Ledger completo de operaciones · ${s.trades?.length||0}</h2>${s.trades?.length?`<div class="table-wrap"><table><thead><tr><th>Trade</th><th>Entrada</th><th>Salida</th><th>Duración</th><th>Invertido</th><th>Precio entrada</th><th>Precio salida</th><th>Profit</th><th>Profit %</th><th>Salida</th></tr></thead><tbody>${trades(s.trades)}</tbody></table></div>`:'<div class="empty">La estrategia no ha generado operaciones todavía</div>'}</article>`;chart(s.equity_curve)}
async function refresh(){try{data=await fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json());document.getElementById('live').textContent='● activo · '+new Date(data.service.updated_at).toLocaleTimeString();const a=data.activity,details=a.details||{};document.getElementById('activity').innerHTML=`<div class="activity"><div><span class="phase">${a.phase}</span> · ${a.message}</div><div class="muted">${details.symbol||details.progress?.timestamp?('Procesando '+(details.symbol||date(details.progress.timestamp))):`Datos: ${data.data_coverage.research_ready}/${data.data_coverage.total}`}</div></div>`;render()}catch(err){document.getElementById('live').textContent='● reconectando';document.getElementById('live').className='bad'}}
document.getElementById('currentTab').onclick=()=>{view='current';render()};document.getElementById('bestTab').onclick=()=>{view='best';render()};refresh();setInterval(refresh,3000);
</script></body></html>
