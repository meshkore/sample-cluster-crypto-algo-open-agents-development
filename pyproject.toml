[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system12"
version = "12.6.0"
description = "System 12: a BTC regime book on Binance perpetuals (paper trading)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[tool.setuptools]
packages = ["system12"]

[tool.setuptools.package-data]
system12 = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
