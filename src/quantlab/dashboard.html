<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantLab · Live research</title><style>
:root{color-scheme:dark;--ink:#06070a;--panel:#10111a;--panel2:#161827;--line:#292c42;--text:#f5f3ff;--muted:#9d9eb2;--violet:#a78bfa;--pink:#f472b6;--coral:#fb7185;--cyan:#22d3ee;--lime:#b6ff5c;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(850px 330px at 10% -15%,#6d28d92c,transparent 70%),radial-gradient(660px 310px at 94% -5%,#ec489928,transparent 70%),var(--ink);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1540px;margin:auto;padding:20px 22px 74px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.mark{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 18px var(--violet)}.brand b{font:800 18px system-ui;letter-spacing:-.04em}.brand span{color:var(--muted);font-size:11px}.right{display:flex;align-items:center;gap:14px}.tabs{display:flex;padding:3px;border:1px solid #ffffff18;border-radius:10px;background:#0c0d14}.tab{border:0;background:transparent;color:var(--muted);font:700 12px system-ui;padding:8px 12px;border-radius:7px;cursor:pointer}.tab.active{background:linear-gradient(110deg,var(--violet),var(--pink));color:#170b1e}.live{color:var(--lime);font-weight:700;white-space:nowrap}.links{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 0}.links a{color:var(--muted);text-decoration:none;font-size:12px}.links a:hover{color:var(--cyan)}.links .dot{color:#55576a}.activity,.notice{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:13px;background:#0e1019cc}.notice{border-color:#783f1e;color:#fde68a;background:#261708cc}.phase{color:var(--cyan);font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.full{grid-column:1/-1}.overview{grid-column:1/-1;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#17192ab8,#0c0d14e8);padding:16px;box-shadow:0 18px 44px #0003}.overview-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.overview-head h1{font:760 18px system-ui;margin:0;letter-spacing:-.03em}.overview-head span{color:var(--muted);font-size:12px}.timeline{position:relative;height:8px;border-radius:99px;background:#292c42;margin:16px 2px 6px}.timeline-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 18px #a78bfa80}.timeline-dot{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px;border:3px solid var(--panel);background:var(--lime);box-shadow:0 0 16px var(--lime);border-radius:50%}.timecopy{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;margin-top:15px}.chart-card,.scorecard{border:1px solid #ffffff12;border-radius:12px;background:#090a11b8}.chart-card{padding:14px}.chart-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:5px}.chart-title h2{font:700 14px system-ui;margin:0}.chart-title span{color:var(--muted);font-size:11px}canvas{width:100%;height:230px;background:linear-gradient(180deg,#a78bfa10,transparent);border-radius:8px}.scorecard{display:grid;grid-template-columns:1fr 1fr;padding:13px;gap:10px}.scorecard .leadmetric{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:10px}.label{color:var(--muted);font-size:11px}.metric{font:760 22px system-ui;letter-spacing:-.045em;margin-top:4px}.leadmetric .metric{font-size:31px}.good{color:var(--lime)}.bad{color:var(--coral)}.amber{color:var(--amber)}.card{grid-column:span 3;border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(145deg,#151727b8,#0d0e15d9);min-width:0}.card h2{font:700 14px system-ui;margin:0 0 10px}.badge{font-size:10px;padding:3px 7px;border:1px solid #ffffff2b;border-radius:99px;margin-left:7px}.validated{color:var(--lime)}.provisional{color:var(--amber)}details{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;background:#10111ab8;overflow:hidden}summary{cursor:pointer;list-style:none;padding:14px 16px;font:700 14px system-ui}summary:after{content:'+';float:right;color:var(--cyan)}details[open] summary:after{content:'−'}details>div{padding:0 16px 16px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.table-wrap{overflow:auto;max-height:480px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#1a1c2d;color:var(--muted);font-weight:600}th:first-child,td:first-child{text-align:left}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d8d7ee;font-size:12px;max-height:300px;overflow:auto}.pill{border:1px solid #ffffff22;border-radius:99px;padding:3px 7px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px}@media(max-width:900px){.hero{grid-template-columns:1fr}.scorecard{grid-template-columns:repeat(4,1fr)}.scorecard .leadmetric{grid-column:span 2;border-bottom:0}.card{grid-column:span 6}}@media(max-width:620px){main{padding:15px 12px 55px}.topbar{align-items:flex-start}.brand span,.links .disclaimer{display:none}.right{align-items:flex-end;flex-direction:column}.tabs{width:100%}.tab{flex:1}.hero{gap:10px}canvas{height:185px}.scorecard{grid-template-columns:1fr 1fr}.scorecard .leadmetric{grid-column:1/-1;border-bottom:1px solid var(--line)}.overview-head{display:block}.overview-head span{display:block;margin-top:5px}.activity{display:block}.activity div+div{margin-top:5px}.detailgrid{grid-template-columns:1fr}.card{grid-column:1/-1}}
</style></head><body><main><header class="topbar"><div class="brand"><i class="mark"></i><b>QuantLab</b><span>OPEN AGENT RESEARCH · LONG-ONLY</span></div><div class="right"><nav class="tabs"><button id="currentTab" class="tab active">Current</button><button id="bestTab" class="tab">Best forward</button></nav><div id="live" class="live">● connecting</div></div></header><nav class="links"><a href="https://github.com/meshkore/sample-cluster-crypto-algo-open-agents-development" target="_blank" rel="noreferrer">Source</a><i class="dot">·</i><a href="https://meshkore.com/clusters/open-crypto-algo-agents-development" target="_blank" rel="noreferrer">Agent cluster</a><i class="dot">·</i><span class="disclaimer">Research only · not financial advice</span></nav><div id="activity"></div><div id="notice"></div><section id="app" class="grid"></section></main><script>
let data=null,view='current';const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v),pct=v=>v==null?'—':(100*Number(v)).toFixed(2)+'%',num=v=>v==null?'—':new Intl.NumberFormat('en-US').format(v),cls=v=>v>0?'good':v<0?'bad':'',duration=s=>s==null?'—':s<86400?(s/3600).toFixed(1)+' h':(s/86400).toFixed(1)+' d',date=v=>v?new Date(v).toLocaleDateString('en-US'):'—';
function timeline(run){if(!run)return '';const forward=String(run.status).startsWith('FORWARD'),aborted=String(run.status).includes('ABORTED'),start=Date.parse(run.period_start),end=Date.parse(run.period_end),now=Date.parse(run.current_date||run.period_start),progress=Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))),title=forward?'Forward evaluation · 2026':'Historical backtest',state=aborted?'STOPPED AT DRAWDOWN LIMIT':run.status;return `<div class="overview-head"><h1>${title}</h1><span class="${aborted?'bad':''}">${state} · ${run.processed_days}/${run.total_days} days</span></div><div class="timeline"><div class="timeline-fill" style="width:${progress}%"></div><div class="timeline-dot" style="left:${progress}%"></div></div><div class="timecopy"><span>${date(run.period_start)}</span><span>Simulated: ${date(run.current_date)}</span><span>${date(run.period_end)}</span></div>`}
function chart(points){setTimeout(()=>{const c=document.getElementById('equityChart');if(!c||!points?.length)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const a=points.map(p=>p.equity),lo=Math.min(...a),hi=Math.max(...a),r=hi-lo||1,g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#22d3ee');g.addColorStop(.5,'#a78bfa');g.addColorStop(1,'#f472b6');x.strokeStyle=g;x.shadowColor='#a78bfa';x.shadowBlur=12;x.lineWidth=2.5;x.beginPath();a.forEach((v,i)=>{const px=i/(a.length-1||1)*w,py=h-9-(v-lo)/r*(h-18);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()},0)}
function assets(items){return(items||[]).map(x=>`<tr><td>${x.symbol}</td><td>${money(x.capital_deployed)}</td><td>${money(x.peak_capital_at_risk)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.return_on_deployed)}">${pct(x.return_on_deployed)}</td><td>${x.trades}</td><td>${pct(x.win_rate)}</td></tr>`).join('')};function trades(items){return(items||[]).map(x=>`<tr><td>${x.symbol} #${x.sequence}</td><td>${date(x.entry_time)}</td><td>${date(x.exit_time)}</td><td>${duration(x.duration_seconds)}</td><td>${money(x.invested_capital)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</td><td><span class="pill">${x.exit_reason}</span></td></tr>`).join('')};
function render(){if(!data)return;const s=view==='current'?data.current_strategy:data.best_strategy,r=s?.backtest,e=s?.experiment;currentTab.classList.toggle('active',view==='current');bestTab.classList.toggle('active',view==='best');notice.innerHTML=view==='best'&&s&&!s.validated?'<div class="notice">Strongest provisional candidate. Not promoted and not eligible for the 2026 forward evaluation.</div>':'';if(!s){app.innerHTML='<article class="overview"><div class="empty">No strategy is available yet.</div></article>';return}const badge=s.validated?'<span class="badge validated">VALIDATED</span>':'<span class="badge provisional">PROVISIONAL</span>';app.innerHTML=`<section class="overview">${timeline(r)}<div class="hero"><div class="chart-card"><div class="chart-title"><h2>Portfolio equity</h2><span>${s.label}${badge}</span></div>${s.equity_curve?.length?'<canvas id="equityChart"></canvas>':'<div class="empty">Equity points appear as the evaluation progresses.</div>'}</div><aside class="scorecard"><div class="leadmetric"><div class="label">Current equity</div><div class="metric ${cls((r?.current_equity||0)-(r?.initial_capital||0))}">${money(r?.current_equity)}</div></div><div><div class="label">Net P&amp;L</div><div class="metric ${cls(r?.net_profit)}">${money(r?.net_profit)}</div></div><div><div class="label">Drawdown</div><div class="metric bad">${pct(r?.max_drawdown)}</div></div><div><div class="label">Trades</div><div class="metric">${num(r?.trades)}</div></div><div><div class="label">Win rate</div><div class="metric">${pct(r?.win_rate)}</div></div></aside></div></section><article class="card"><div class="label">Starting capital</div><div class="metric">${money(r?.initial_capital)}</div></article><article class="card"><div class="label">Return</div><div class="metric ${cls(r?.return_pct)}">${pct(r?.return_pct)}</div></article><article class="card"><div class="label">Assets traded</div><div class="metric">${num(r?.assets_traded)}</div></article><article class="card"><div class="label">Open positions</div><div class="metric">${num(r?.open_positions)}</div></article><details><summary>Strategy, execution and research metrics</summary><div class="detailgrid"><article><h2>Signal criteria</h2><pre>${JSON.stringify({family:s.definition.family,signal:s.definition.signal,parameters:e?.parameters},null,2)}</pre></article><article><h2>Execution and risk management</h2><pre>${JSON.stringify({execution:s.definition.execution,money_management:s.definition.money_management},null,2)}</pre></article></div></details><details><summary>Asset results · ${s.assets?.length||0} assets</summary><div>${s.assets?.length?`<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Capital</th><th>Peak at risk</th><th>P&amp;L</th><th>Return</th><th>Trades</th><th>Win rate</th></tr></thead><tbody>${assets(s.assets)}</tbody></table></div>`:'<div class="empty">No asset results yet.</div>'}</div></details><details><summary>Trade ledger · ${s.trades?.length||0}</summary><div>${s.trades?.length?`<div class="table-wrap"><table><thead><tr><th>Trade</th><th>Entry</th><th>Exit</th><th>Duration</th><th>Capital</th><th>P&amp;L</th><th>P&amp;L %</th><th>Exit reason</th></tr></thead><tbody>${trades(s.trades)}</tbody></table></div>`:'<div class="empty">This strategy has not produced trades yet.</div>'}</div></details>`;chart(s.equity_curve)}
async function refresh(){try{data=await fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json());live.textContent='● live · '+new Date(data.service.updated_at).toLocaleTimeString('en-US');const a=data.activity,details=a.details||{};activity.innerHTML=`<div class="activity"><div><span class="phase">${a.phase}</span> · ${a.message}</div><div class="muted">${details.symbol||details.progress?.timestamp?('Processing '+(details.symbol||date(details.progress.timestamp))):`Data: ${data.data_coverage.research_ready}/${data.data_coverage.total}`}</div></div>`;render()}catch{live.textContent='● reconnecting';live.className='bad'}}currentTab.onclick=()=>{view='current';render()};bestTab.onclick=()=>{view='best';render()};refresh();setInterval(refresh,3000);
</script></body></html>
