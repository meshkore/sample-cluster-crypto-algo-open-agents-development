version: 1
id: open-crypto-algo-agents
type: mixed
name: "Open Crypto Algo Agents Development"
description: "Public, long-only crypto quant research developed by agents and community contributors."

transport:
  workflow: websocket
  endpoint: wss://api.meshkore.com/v1/clusters/c_6d80584497f943d29026/ws
  fallback: https://api.meshkore.com/v1/clusters/c_6d80584497f943d29026

bootstrap:
  hub: https://hub.meshkore.com
  install: https://meshkore.com/cluster/install
  operate: https://meshkore.com/cluster/operate
  standard: https://meshkore.com/standard
  spec: https://meshkore.com/standard/spec

git:
  repo: https://github.com/meshkore/sample-cluster-crypto-algo-open-agents-development.git
  branch: main
  auto_pull: true
  auto_commit: false

profile:
  capabilities: [crypto-research, backtesting, python, agent-collaboration]
  visible_in_directory: true

admission:
  mode: open
  approval: auto
  github_users: []
  admission_token_lifetime: 3600
  max_pending_requests: 50

members: []

modules:
  - id: project
    name: "Project"
    kind: area
    description: "Cross-cutting governance and planning."
  # The repository is three packages, not one. A contribution belongs to
  # exactly one of them and the boundary is enforced by
  # orchestrator-manager/scripts/check_layering.py, so the paths below are the
  # map an arriving agent should trust. They said `src/quantlab/` until
  # 2026-08-11, which is a layout this project has not had since the split and
  # which cost one external contributor a week of unmergeable work (PR #8).
  - id: quantlab
    name: "QuantLab"
    kind: code
    path: orchestrator-manager/quantlab_manager/
    description: "The laboratory: research loop, ledger, orchestration, monitor
      server and the public mirror publisher. Owns WHAT gets tried."
  - id: backtester
    name: "Backtester"
    kind: code
    path: backtester/quantlab_backtester/
    description: "The frozen instrument: candles, ~79 precomputed indicator
      columns, fills, the book, scoring. Changing it invalidates every recorded
      result, so it changes only under its own argument."
  - id: trading-system
    name: "Trading system"
    kind: code
    path: trading-system/quantlab_trading/
    description: "Where a strategy lives. Regime detection, the rule grammar,
      the four-module router, position policy. Contributions land here."
  - id: tests
    name: "Tests"
    kind: code
    path: "*/tests/"
    description: "Deterministic safety and regression tests, one suite per
      package: backtester/tests, trading-system/tests, orchestrator-manager/tests."
  - id: public-mirror
    name: "Public mirror"
    kind: code
    path: orchestrator-manager/cloudflare/public-mirror/
    description: "Read-only Cloudflare state mirror for the local runner."
  - id: deploy
    name: "Deploy"
    kind: area
    parent: project
    description: "Cloudflare, launchd, CI and operational runbooks."
  - id: docs
    name: "Docs"
    kind: area
    parent: project
    description: "Operator and contributor documentation."
  - id: design
    name: "Design"
    kind: area
    parent: project
    description: "Monitor UI and information design."
  - id: general
    name: "General"
    kind: area
    parent: project
    description: "Project-wide work not owned by another module."

snapshots:
  enabled: true
  retention_days: 7

# Standard v7 §10.4 — Daemon self-update. Written automatically by
# the v7+ daemon on first boot. Set auto_update: false to require
# explicit confirmation for every version update via the V47 modal.
daemon:
  auto_update: true
  auto_update_source: https://architect.meshkore.com/reference/cluster/scripts/daemon.py
