[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-crypto-quantlab"
version = "0.1.0"
description = "Deterministic, persistent crypto strategy research laboratory"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
