<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantLab · Live research observatory</title><style>
:root{color-scheme:dark;--ink:#06070a;--panel:#10111a;--panel2:#151727;--line:#292c42;--text:#f5f3ff;--muted:#a6a7bb;--violet:#a78bfa;--pink:#f472b6;--coral:#fb7185;--cyan:#22d3ee;--lime:#b6ff5c;--amber:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 9% -12%,#6d28d940,transparent 70%),radial-gradient(700px 420px at 96% 0,#ec489935,transparent 68%),var(--ink);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}main{position:relative;max-width:1540px;margin:auto;padding:28px 22px 86px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin-bottom:18px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.17em}.brand h1{font:800 clamp(32px,5vw,58px)/.94 system-ui;margin:8px 0 10px;letter-spacing:-.06em;background:linear-gradient(100deg,#fff 0%,#ddd6fe 27%,#f0abfc 57%,#fda4af 78%,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}.lead{max-width:650px;color:var(--muted);line-height:1.55;margin:0}.right{display:flex;align-items:flex-end;gap:15px;flex-direction:column}.tabs{display:flex;padding:4px;border:1px solid #ffffff18;border-radius:12px;background:#080911cc;box-shadow:0 16px 50px #0005}.tab{border:0;background:transparent;color:var(--muted);font:700 13px system-ui;padding:10px 15px;border-radius:8px;cursor:pointer}.tab.active{background:linear-gradient(110deg,var(--violet),var(--pink));color:#160b1d}.live{color:var(--lime);font-weight:700}.project-links{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 18px}.project-links a{color:var(--text);text-decoration:none;border:1px solid #ffffff25;border-radius:99px;padding:8px 11px;background:#ffffff08;transition:.2s}.project-links a:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}.disclaimer{color:var(--muted);font-size:12px}.activity,.notice{display:flex;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;background:#0e1019cc;backdrop-filter:blur(12px)}.notice{border-color:#783f1e;background:#261708cc;color:#fde68a}.phase{color:var(--cyan);font-weight:800}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 3;background:linear-gradient(145deg,#1a1c2db8,#0d0e15d9);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0;box-shadow:0 16px 40px #0003}.half{grid-column:span 6}.full{grid-column:1/-1}.metric{font:780 26px system-ui;letter-spacing:-.04em;margin-top:7px}.label,.muted{color:var(--muted)}.good{color:var(--lime)}.bad{color:var(--red)}.amber{color:var(--amber)}h2{font:720 16px system-ui;margin:0 0 14px;letter-spacing:-.02em}.timeline{position:relative;height:12px;border-radius:99px;background:#292c42;margin:28px 2px 8px;overflow:visible}.timeline-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 22px #a78bfa80}.timeline-dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px;border:3px solid var(--panel);background:var(--lime);box-shadow:0 0 20px #b6ff5c;border-radius:50%}.timeline-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.timeline-now{text-align:center;color:var(--cyan);margin-top:10px}.progress-meta{display:flex;justify-content:space-between;gap:15px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d8d7ee;font-size:12px;max-height:330px;overflow:auto}.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #292c42}th{position:sticky;top:0;background:#1a1c2d;color:var(--muted);font-weight:600;z-index:1}th:first-child,td:first-child{text-align:left}.pill{display:inline-block;border:1px solid #ffffff25;padding:4px 8px;border-radius:99px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:38px}.badge{font-size:10px;padding:4px 8px;border-radius:99px;border:1px solid #ffffff2b;margin-left:8px;vertical-align:middle}.validated{color:var(--lime)}.provisional{color:var(--amber)}canvas{width:100%;height:210px;border-radius:10px;background:linear-gradient(180deg,#a78bfa0c,transparent)}@media(max-width:980px){header{align-items:flex-start}.right{align-items:flex-start}.card,.half{grid-column:span 6}}@media(max-width:680px){main{padding:20px 13px 60px}header,.activity{display:block}.right{margin-top:20px}.tabs{width:100%;display:grid;grid-template-columns:1fr 1fr}.tab{padding:11px 8px}.live{margin-top:12px}.card,.half{grid-column:1/-1}.activity div:last-child{margin-top:7px}.metric{font-size:23px}}
</style></head><body><main><header><div class="brand"><div class="eyebrow">OPEN AGENT RESEARCH · LONG-ONLY · FORWARD LOCKED</div><h1>Build the signal.<br>Show the evidence.</h1><p class="lead">A public observatory for the strategy engine, its execution logic, and its 2026 forward evidence.</p></div><div class="right"><nav class="tabs"><button id="currentTab" class="tab active">Current research</button><button id="bestTab" class="tab">Best forward</button></nav><div id="live" class="live">● connecting</div></div></header><nav class="project-links" aria-label="Public project links"><a href="https://github.com/meshkore/sample-cluster-crypto-algo-open-agents-development" target="_blank" rel="noreferrer">Source code ↗</a><a href="https://meshkore.com/clusters/open-crypto-algo-agents-development" target="_blank" rel="noreferrer">Public agent cluster ↗</a><span class="disclaimer">Research only · not financial advice</span></nav><div id="activity"></div><div id="notice"></div><section id="app" class="grid"></section></main><script>
let data=null,view='current';const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v),pct=v=>v==null?'—':(100*Number(v)).toFixed(2)+'%',num=v=>v==null?'—':new Intl.NumberFormat('en-US').format(v),cls=v=>v>0?'good':v<0?'bad':'',duration=s=>s==null?'—':s<86400?(s/3600).toFixed(1)+' h':(s/86400).toFixed(1)+' d',date=v=>v?new Date(v).toLocaleDateString('en-US'):'—';const metric=(label,value,kind='')=>`<article class="card"><div class="label">${label}</div><div class="metric ${kind}">${value}</div></article>`;
function timeline(run){if(!run)return `<article class="card full"><h2>Evaluation timeline</h2><div class="empty">Preparing market data for the next simulation</div></article>`;const forward=String(run.status).startsWith('FORWARD'),aborted=String(run.status).includes('ABORTED'),start=Date.parse(run.period_start),end=Date.parse(run.period_end),now=Date.parse(run.current_date||run.period_start),progress=Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))),title=forward?'Phase 2 · Forward evaluation 2026':'Phase 1 · Historical backtest',endLabel=forward?'Target · '+date(run.period_end):'Strict cutoff · Jan 1, 2026',stateClass=aborted?'bad':run.status==='BACKTESTING'||run.status==='FORWARD_TESTING'?'amber':'good';return `<article class="card full"><div class="progress-meta"><h2>${title}</h2><span class="${stateClass}">${run.status} · ${run.processed_days}/${run.total_days} days</span></div><div class="timeline"><div class="timeline-fill" style="width:${progress}%"></div><div class="timeline-dot" style="left:${progress}%"></div></div><div class="timeline-labels"><span>${date(run.period_start)}</span><span>${endLabel}</span></div><div class="timeline-now ${aborted?'bad':''}">${aborted?'STOPPED AT DRAWDOWN LIMIT · ':''}Simulated date: ${date(run.current_date)}</div></article>`}
function assets(items){return(items||[]).map(x=>`<tr><td>${x.symbol}</td><td>${money(x.capital_deployed)}</td><td>${money(x.peak_capital_at_risk)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.return_on_deployed)}">${pct(x.return_on_deployed)}</td><td>${x.trades}</td><td>${pct(x.win_rate)}</td><td class="${x.capital_preserved?'good':'bad'}">${x.capital_preserved?'YES':'NO'}</td></tr>`).join('')}
function trades(items){return(items||[]).map(x=>`<tr><td>${x.symbol} #${x.sequence}</td><td>${date(x.entry_time)}</td><td>${date(x.exit_time)}</td><td>${duration(x.duration_seconds)}</td><td>${money(x.invested_capital)}</td><td>${Number(x.entry_price).toFixed(6)}</td><td>${Number(x.exit_price).toFixed(6)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</td><td><span class="pill">${x.exit_reason}</span></td></tr>`).join('')}
function chart(points){setTimeout(()=>{const c=document.getElementById('equityChart');if(!c||!points?.length)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const values=points.map(p=>p.equity),lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1,gradient=x.createLinearGradient(0,0,w,0);gradient.addColorStop(0,'#22d3ee');gradient.addColorStop(.5,'#a78bfa');gradient.addColorStop(1,'#f472b6');x.strokeStyle=gradient;x.shadowColor='#a78bfa';x.shadowBlur=12;x.lineWidth=2.5;x.beginPath();values.forEach((v,i)=>{const px=i/(values.length-1||1)*w,py=h-10-(v-lo)/range*(h-20);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()},0)}
function render(){if(!data)return;const s=view==='current'?data.current_strategy:data.best_strategy,r=s?.backtest,e=s?.experiment;currentTab.classList.toggle('active',view==='current');bestTab.classList.toggle('active',view==='best');notice.innerHTML=view==='best'&&s&&!s.validated?'<div class="notice">This is the strongest provisional candidate. It is not promoted and cannot enter the 2026 forward evaluation.</div>':'';if(!s){app.innerHTML='<article class="card full"><div class="empty">No strategy is available yet.</div></article>';return}const badge=s.validated?'<span class="badge validated">VALIDATED</span>':'<span class="badge provisional">PROVISIONAL</span>';app.innerHTML=timeline(r)+metric('Strategy',s.label+badge)+metric('Starting capital',money(r?.initial_capital))+metric('Current equity',money(r?.current_equity),cls((r?.current_equity||0)-(r?.initial_capital||0)))+metric('Net P&L',money(r?.net_profit),cls(r?.net_profit))+metric('Return',pct(r?.return_pct),cls(r?.return_pct))+metric('Maximum drawdown',pct(r?.max_drawdown),'bad')+metric('Trades',num(r?.trades))+metric('Win rate',pct(r?.win_rate))+metric('Assets available',num(r?.assets_available))+metric('Assets traded',num(r?.assets_traded))+metric('Cash',money(r?.cash))+metric('Open positions',num(r?.open_positions))+`<article class="card full"><h2>Portfolio equity curve</h2>${s.equity_curve?.length?'<canvas id="equityChart"></canvas>':'<div class="empty">The curve appears as the evaluation progresses.</div>'}</article><article class="card half"><h2>Entry and exit criteria</h2><pre>${JSON.stringify({family:s.definition.family,signal:s.definition.signal,parameters:e?.parameters},null,2)}</pre></article><article class="card half"><h2>Execution and dynamic risk management</h2><pre>${JSON.stringify({execution:s.definition.execution,money_management:s.definition.money_management},null,2)}</pre></article><article class="card full"><h2>Result by asset · ${s.assets?.length||0} assets</h2>${s.assets?.length?`<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Capital deployed</th><th>Peak at risk</th><th>P&amp;L</th><th>Return / deployed</th><th>Trades</th><th>Win rate</th><th>Capital preserved</th></tr></thead><tbody>${assets(s.assets)}</tbody></table></div>`:'<div class="empty">No asset results yet.</div>'}</article><article class="card full"><h2>Full trade ledger · ${s.trades?.length||0}</h2>${s.trades?.length?`<div class="table-wrap"><table><thead><tr><th>Trade</th><th>Entry</th><th>Exit</th><th>Duration</th><th>Capital</th><th>Entry price</th><th>Exit price</th><th>P&amp;L</th><th>P&amp;L %</th><th>Exit reason</th></tr></thead><tbody>${trades(s.trades)}</tbody></table></div>`:'<div class="empty">This strategy has not produced trades yet.</div>'}</article>`;chart(s.equity_curve)}
async function refresh(){try{data=await fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json());live.textContent='● live · '+new Date(data.service.updated_at).toLocaleTimeString('en-US');const a=data.activity,details=a.details||{};activity.innerHTML=`<div class="activity"><div><span class="phase">${a.phase}</span> · ${a.message}</div><div class="muted">${details.symbol||details.progress?.timestamp?('Processing '+(details.symbol||date(details.progress.timestamp))):`Data: ${data.data_coverage.research_ready}/${data.data_coverage.total}`}</div></div>`;render()}catch{live.textContent='● reconnecting';live.className='bad'}}currentTab.onclick=()=>{view='current';render()};bestTab.onclick=()=>{view='best';render()};refresh();setInterval(refresh,3000);
</script></body></html>
