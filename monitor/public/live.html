<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantLab · the loop, live</title>
<meta name="description" content="The research loop as it runs: seven stages in a circle, lit as the orchestrator walks them, with every event it produces.">
<style>
:root{
  --bg:#0b0f14; --panel:#121822; --panel-2:#182031; --line:#233047;
  --ink:#e8eef7; --muted:#8ba0bd; --dim:#5c718f;
  --up:#3fd18b; --down:#ff6b6b; --live:#ffb454; --accent:#5aa9ff;
  --seal:#c792ea; --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- the thin bar ---------- */
#bar{
  display:flex; align-items:center; gap:12px; padding:8px 16px;
  border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;
}
#bar a.home{color:var(--muted); text-decoration:none; font-weight:600; font-size:13px}
#bar a.home:hover{color:var(--ink)}
#bar .sep{color:var(--dim)}
#bar h1{margin:0; font-size:13px; font-weight:600; letter-spacing:.02em}
#bar .who{color:var(--dim); font-size:12px}
#bar #conn{margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap}
#bar #conn::before{content:"●"; margin-right:5px; color:var(--dim)}
#bar #conn.ws::before{color:var(--up)}
#bar #conn.poll::before{color:var(--live)}
#bar #conn.bad::before{color:var(--down)}

/* ---------- the two panes ---------- */
#panes{display:grid; grid-template-columns:minmax(0,1fr) 420px; flex:1; min-height:0}
@media (max-width:1100px){ #panes{grid-template-columns:1fr; grid-template-rows:1fr 320px} }

/* The diagram is a SQUARE. It is a cycle, and a cycle drawn wide is a racetrack
   -- the shape itself is the thing that says "this comes back to the start". */
#stage{
  min-width:0; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:16px; overflow:hidden;
}
#square{width:min(100%,calc(100vh - 130px)); aspect-ratio:1/1; position:relative}
svg{width:100%; height:100%; display:block; overflow:visible}

.ring{fill:none; stroke:var(--line); stroke-width:1.5}
.flow{fill:none; stroke:#2b3c58; stroke-width:2.5; stroke-linecap:round}
/* The travelling dash is the only motion on the page that is not data. It says
   "this is a cycle and it is turning", which a static ring cannot. */
.flow.on{stroke:var(--live); stroke-dasharray:5 9; animation:march 1.1s linear infinite}
@keyframes march{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion:reduce){ .flow.on{animation:none; stroke-dasharray:none} }

.node rect{
  fill:var(--panel); stroke:var(--line); stroke-width:1.5; rx:11;
  transition:fill .25s, stroke .25s;
}
.node .n{
  font:700 9.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  fill:var(--dim); transition:fill .25s;
}
.node .t{font:600 12.5px/1.2 ui-sans-serif,system-ui; fill:var(--ink)}
.node .s{font:11px/1.3 ui-sans-serif,system-ui; fill:var(--muted)}
.node.done rect{stroke:#2f6b50}
.node.done .n{fill:var(--up)}
.node.on rect{fill:#241d10; stroke:var(--live); stroke-width:2.5}
.node.on .n{fill:var(--live)}
/* FORWARD is the sealed window. It is the one box that is never fitted against,
   so it never shares the working colour. */
.node.seal.on rect{fill:#20172b; stroke:var(--seal)}
.node.seal.on .n{fill:var(--seal)}
.node.seal.done rect{stroke:#5b3f78}
.node.seal.done .n{fill:var(--seal)}

.pulse{fill:var(--live); opacity:0}
.node.on .pulse{animation:beat 1.6s ease-out infinite}
@keyframes beat{0%{opacity:.5;r:5}70%{opacity:0;r:22}100%{opacity:0;r:22}}
@media (prefers-reduced-motion:reduce){ .node.on .pulse{animation:none} }

/* The middle of the circle: what hypothesis is being tried, and how far in. */
.hub .id{font:700 13px/1 var(--mono); fill:var(--ink); letter-spacing:.06em}
.hub .cap{font:700 9px/1 var(--mono); letter-spacing:.15em; fill:var(--dim); text-transform:uppercase}
.hub .claim{font:12px/1.35 ui-sans-serif,system-ui; fill:var(--muted)}
.hub .big{font:700 26px/1 ui-sans-serif,system-ui; fill:var(--ink)}

/* The genetic search is a loop inside a loop, and drawing it as one box would
   hide the thing that takes ninety per cent of the hour. */
.inner{fill:none; stroke:#4a3a1c; stroke-width:1.5; stroke-dasharray:3 5}
.inner.on{stroke:var(--live); animation:march 1.4s linear infinite}
.innerlabel{font:9.5px/1 var(--mono); fill:var(--dim); letter-spacing:.08em}

/* ---------- the journal ---------- */
#journal{
  border-left:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
@media (max-width:1100px){ #journal{border-left:0; border-top:1px solid var(--line)} }
#jhead{
  padding:10px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:9px; flex:0 0 auto;
}
#jhead h2{
  margin:0; font-size:10.5px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:700;
}
#jhead select{
  font:inherit; font-size:11.5px; background:var(--panel-2); color:var(--ink);
  border:1px solid var(--line); border-radius:6px; padding:3px 6px; max-width:140px;
}
#jhead .count{
  margin-left:auto; color:var(--dim); font-size:10px; font-weight:600;
  background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:1px 8px;
}
#jlist{overflow-y:auto; flex:1; min-height:0; padding:6px 0 40px}
.ev{padding:7px 14px; border-bottom:1px solid #1a2331; display:grid; gap:3px}
.ev:hover{background:var(--panel-2)}
.ev .h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.ev .at{font:10.5px var(--mono); color:var(--dim); flex:0 0 auto}
.ev .st{
  font:700 9px var(--mono); letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:var(--muted);
}
.ev.k-frame .st,.ev.k-consult .st{color:var(--accent); border-color:#28456e}
.ev.k-fit .st{color:var(--live); border-color:#4a3a1c}
.ev.k-forward .st{color:var(--seal); border-color:#5b3f78}
.ev.k-record .st{color:var(--up); border-color:#2f6b50}
.ev .say{color:var(--ink); font-size:12.5px}
.ev .kv{font:11px/1.45 var(--mono); color:var(--muted); word-break:break-word; white-space:pre-wrap}
.ev .kv b{color:var(--ink); font-weight:600}
.empty{color:var(--dim); font-size:12px; padding:20px 14px; text-align:center}
</style>
</head>
<body>

<div id="bar">
  <a class="home" href="/">← QuantLab</a>
  <span class="sep">·</span>
  <h1>The loop, live</h1>
  <span class="who" id="owner"></span>
  <div id="conn">connecting…</div>
</div>

<div id="panes">
  <div id="stage"><div id="square"><svg id="wheel" viewBox="0 0 1000 1000" role="img"
      aria-label="The research loop as seven stages in a circle"></svg></div></div>

  <div id="journal">
    <div id="jhead">
      <h2>Journal</h2>
      <select id="pick" aria-label="Which hypothesis"></select>
      <span class="count" id="jcount">0</span>
    </div>
    <div id="jlist"><div class="empty">Waiting for the loop.</div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v==null ? "—" : (v*100).toFixed(2)+"%";

/* ---------- the seven stages ----------

   Seven, and the same seven as `docs/architecture/research-loop.md`, so the
   drawing and the prose cannot drift. `note` is what the box says when nothing
   is happening in it; the loop overwrites it with what is actually happening.

   COMPOSE is deliberately not "write the code". This loop cannot write code.
   It composes expression trees over the 79 served columns -- data, validated by
   the grammar before anything runs them -- and calling that "writing code"
   would misdescribe the one guarantee that makes an unattended loop safe. */
const NODES = [
  {key:"frame",   name:"Frame",   title:"Which module is losing money",
   note:"Reads the last run's profit and loss per module. The target is arithmetic, never a guess."},
  {key:"consult", name:"Consult", title:"Ask the cluster and the advisors",
   note:"Posts the hypothesis publicly, reads the replies, asks the proposer — which on an exploration turn may search the open web."},
  {key:"compose", name:"Compose", title:"Build the population",
   note:"The incumbent, plus the seed rules that survived the grammar, plus invented expression trees. Rules are data, not code."},
  {key:"fit",     name:"Fit",     title:"Genetic search, all of it before 2026",
   note:"Breeds and scores rule trees over four disjoint windows, every one ending on or before 2025-12-31."},
  {key:"decide",  name:"Decide",  title:"Better than the incumbent, or not",
   note:"The verdict is settled here — on the folds — before the sealed window is touched."},
  {key:"forward", name:"Forward", title:"Open 2026, once", seal:true,
   note:"One shot at the sealed year, recorded whatever it says, and never fed back into anything."},
  {key:"record",  name:"Record",  title:"Ledger, cluster, incumbent",
   note:"Appends the hypothesis to the append-only ledger, posts the result, moves the incumbent or does not. Then back to Frame."},
];
const INDEX = Object.fromEntries(NODES.map((n,i)=>[n.key,i]));

/* Seven boxes on a circle, starting UP-LEFT and turning clockwise: right along
   the top, down the right side, left along the bottom, up the left side, back
   to the start. -135° is up-left; angle grows clockwise because SVG's y points
   down. */
const CX=500, CY=500, R=362, START=-135, STEP=360/NODES.length;
const at = i => {
  const a = (START + i*STEP) * Math.PI/180;
  return {x: CX + R*Math.cos(a), y: CY + R*Math.sin(a), a};
};

const BOX_W=232, BOX_H=112;

function wrap(text, chars, max){
  const words=String(text||"").split(/\s+/), lines=[]; let line="";
  for(const w of words){
    if((line+" "+w).trim().length > chars){ lines.push(line.trim()); line=w; }
    else line += " "+w;
    if(lines.length>=max) break;
  }
  if(line.trim() && lines.length<max) lines.push(line.trim());
  if(lines.length===max && words.join(" ").length > lines.join(" ").length+1){
    lines[max-1] = lines[max-1].replace(/[.,;:]?$/,"") + "…";
  }
  return lines;
}

function drawWheel(){
  const svg = $("#wheel");
  const parts = [];

  // The ring, then one arc per gap so a single leg can light on its own.
  parts.push(`<circle class="ring" cx="${CX}" cy="${CY}" r="${R}"/>`);
  for(let i=0;i<NODES.length;i++){
    const from = at(i), to = at((i+1)%NODES.length);
    // Inset each arc so it starts and ends clear of the boxes it joins.
    const pad = 0.30;
    const a1 = from.a + pad, a2 = to.a - pad;
    const p1 = {x:CX+R*Math.cos(a1), y:CY+R*Math.sin(a1)};
    const p2 = {x:CX+R*Math.cos(a2), y:CY+R*Math.sin(a2)};
    parts.push(`<path class="flow" id="leg-${i}" d="M${p1.x.toFixed(1)},${p1.y.toFixed(1)} A${R},${R} 0 0 1 ${p2.x.toFixed(1)},${p2.y.toFixed(1)}"
      marker-end="url(#head)"/>`);
  }

  // The genetic search: a loop inside the FIT box, because that is where most
  // of every hour is actually spent.
  const f = at(INDEX.fit);
  parts.push(`<circle class="inner" id="inner" cx="${f.x.toFixed(1)}" cy="${(f.y+BOX_H/2+34).toFixed(1)}" r="24"/>`);
  parts.push(`<text class="innerlabel" x="${f.x.toFixed(1)}" y="${(f.y+BOX_H/2+96).toFixed(1)}"
      text-anchor="middle">generation → score → breed</text>`);

  for(let i=0;i<NODES.length;i++){
    const n = NODES[i], p = at(i);
    const x = p.x - BOX_W/2, y = p.y - BOX_H/2;
    parts.push(`<g class="node${n.seal?" seal":""}" id="node-${n.key}">
      <circle class="pulse" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5"/>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${BOX_W}" height="${BOX_H}"/>
      <text class="n" x="${(x+14).toFixed(1)}" y="${(y+22).toFixed(1)}">${i+1} · ${esc(n.name)}</text>
      <text class="t" x="${(x+14).toFixed(1)}" y="${(y+43).toFixed(1)}">${esc(n.title)}</text>
      <text class="s" id="say-${n.key}" x="${(x+14).toFixed(1)}" y="${(y+63).toFixed(1)}"></text>
    </g>`);
  }

  svg.innerHTML = `<defs>
      <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2b3c58"/>
      </marker>
    </defs>
    ${parts.join("")}
    <g class="hub">
      <text class="cap" x="${CX}" y="${CY-58}" text-anchor="middle">Hypothesis</text>
      <text class="id"  x="${CX}" y="${CY-34}" text-anchor="middle" id="hub-id">—</text>
      <text class="big" x="${CX}" y="${CY+6}"  text-anchor="middle" id="hub-big">idle</text>
      <text class="claim" x="${CX}" y="${CY+34}" text-anchor="middle" id="hub-c1"></text>
      <text class="claim" x="${CX}" y="${CY+52}" text-anchor="middle" id="hub-c2"></text>
      <text class="claim" x="${CX}" y="${CY+70}" text-anchor="middle" id="hub-c3"></text>
    </g>`;

  for(const n of NODES) setSay(n.key, n.note);
}

function setSay(key, text){
  const el = document.getElementById(`say-${key}`);
  if(!el) return;
  const box = NODES[INDEX[key]];
  const lines = wrap(text || box.note, 34, 3);
  const x = at(INDEX[key]).x - BOX_W/2 + 14;
  el.innerHTML = lines.map((l,i)=>
    `<tspan x="${x.toFixed(1)}" dy="${i?14:0}">${esc(l)}</tspan>`).join("");
}

/* ---------- state ---------- */
let ACTIVE = null;          // the node lit right now
const SEEN = new Set();     // nodes this hypothesis has already walked
let HYP = null;             // the hypothesis on screen
let EVENTS = [];            // its journal
let FOLLOW = true;          // follow the loop, unless the reader picked a past one

function light(node){
  if(!INDEX.hasOwnProperty(node)) return;
  ACTIVE = node; SEEN.add(node);
  for(const n of NODES){
    const el = document.getElementById(`node-${n.key}`);
    el.classList.toggle("on", n.key===node);
    el.classList.toggle("done", n.key!==node && SEEN.has(n.key));
  }
  // The leg leaving the live box is the one that is turning.
  for(let i=0;i<NODES.length;i++){
    document.getElementById(`leg-${i}`).classList.toggle("on", i===INDEX[node]);
  }
  document.getElementById("inner").classList.toggle("on", node==="fit");
}

function resetWheel(){
  SEEN.clear(); ACTIVE=null;
  for(const n of NODES){
    const el = document.getElementById(`node-${n.key}`);
    el.classList.remove("on","done");
    setSay(n.key, n.note);
  }
  for(let i=0;i<NODES.length;i++) document.getElementById(`leg-${i}`).classList.remove("on");
  document.getElementById("inner").classList.remove("on");
}

/* What a box says while it is working. Written from the event's own payload, so
   it is what happened rather than a label for what usually happens. */
function sayFor(e){
  const n = e.node, s = e.stage;
  if(s==="frame")      return e.why || e.say;
  if(s==="consulting") return "Posting the hypothesis and reading replies…";
  if(s==="consulted"){
    const bits = [];
    if(e.seed_rules && e.seed_rules.length) bits.push(`${e.seed_rules.length} seed rules survived the grammar`);
    if(e.peers) bits.push(`${e.peers} peer replies`);
    if(e.web) bits.push("proposer searched the web");
    return bits.join(" · ") || e.detail || e.say;
  }
  if(s==="fit")        return `Generation ${e.generation ?? "?"} of ${e.of ?? "?"} · best ${e.best!=null?Number(e.best).toFixed(4):"—"}`;
  if(s==="backtest")   return `Backtest ${e.backtests ?? "?"}${e.planned?` of ~${e.planned}`:""} · fold ${e.fold ?? "?"}/${e.folds ?? "?"} · ${pct(e.return_pct)}`;
  if(s==="fitted")     return `Fit score ${e.score!=null?Number(e.score).toFixed(4):"—"} — comparing with this module's best`;
  if(s==="trained")    return `Training ${pct(e.return_pct)} on ${e.trades ?? 0} trades`;
  if(s==="opening")    return "The sealed window is opening on this fit";
  if(s==="forward")    return `2026: ${pct(e.return_pct)} on ${e.trades ?? 0} trades`;
  if(s==="recorded")   return `Verdict: ${e.verdict || "—"} — back to Frame`;
  if(s==="error")      return String(e.detail || "an iteration failed").slice(0,160);
  return e.say || s;
}

function apply(e){
  if(!e || !e.node) return;
  if(e.iteration!=null) $("#hub-big").textContent = `iteration ${e.iteration}`;
  const id = e.id || HYP;
  if(id && id !== HYP){ HYP = id; resetWheel(); }
  if(HYP) $("#hub-id").textContent = HYP;
  light(e.node);
  setSay(e.node, sayFor(e));
  if(e.stage === "consulted" && e.claim){
    const lines = wrap(e.claim, 34, 3);
    ["hub-c1","hub-c2","hub-c3"].forEach((el,i)=>
      document.getElementById(el).textContent = lines[i] || "");
  }
  if(e.stage === "begin"){
    ["hub-c1","hub-c2","hub-c3"].forEach(el => document.getElementById(el).textContent = "");
  }
}

/* ---------- the journal ---------- */
const HIDE = new Set(["at","iteration","stage","node","say"]);
function evHTML(e){
  const rest = Object.entries(e)
    .filter(([k,v]) => !HIDE.has(k) && v!=null && v!=="" && !(Array.isArray(v)&&!v.length))
    .map(([k,v]) => `<b>${esc(k)}</b> ${esc(typeof v==="object" ? JSON.stringify(v) : v)}`)
    .join("\n");
  return `<div class="ev k-${esc(e.node||"record")}">
    <div class="h">
      <span class="at">${esc(String(e.at||"").slice(11,19))}</span>
      <span class="st">${esc(e.stage||"")}</span>
    </div>
    <div class="say">${esc(sayFor(e))}</div>
    ${rest?`<div class="kv">${rest}</div>`:""}
  </div>`;
}

function renderJournal(){
  const list = $("#jlist");
  $("#jcount").textContent = EVENTS.length;
  if(!EVENTS.length){ list.innerHTML = '<div class="empty">No events for this hypothesis yet.</div>'; return; }
  const stuck = list.scrollTop + list.clientHeight >= list.scrollHeight - 40;
  list.innerHTML = EVENTS.map(evHTML).join("");
  // Follow the tail, unless the reader has scrolled up to read something.
  if(stuck) list.scrollTop = list.scrollHeight;
}

function ingest(e){
  EVENTS.push(e);
  renderJournal();
  apply(e);
}

/* ---------- transport ----------

   A WebSocket when the page is served by the local daemon, which tails the
   journal and pushes each line as the loop writes it. The public mirror is a
   Cloudflare Worker in front of R2 and receives snapshots rather than holding a
   socket open to this machine, so there the same events arrive by polling. The
   page does not care which it got: both deliver journal events in order. */
let SOCKET = null, POLLING = null;

function conn(kind, text){
  const el = $("#conn");
  el.className = kind;
  el.textContent = text;
}

/* Ask whether a socket is even possible before opening one.

   `/health` is served by the daemon and by nothing else: the public mirror is a
   Worker in front of R2 that receives pushed snapshots, and by design nothing
   on the internet may open a connection back to the laboratory. So on the
   public site a WebSocket attempt cannot succeed, and attempting it anyway put
   a failed-handshake error in every visitor's console before the page quietly
   fell back to what it was always going to use. Probing first is not a
   workaround; it is the page asking which of two architectures it is in. */
async function chooseTransport(){
  let socketed = false;
  try{
    const r = await fetch("/health", {cache:"no-store"});
    socketed = r.ok && (await r.json()).websocket === true;
  }catch(err){ socketed = false; }
  if(socketed) openSocket(); else startPolling();
}

function openSocket(){
  let ws;
  try{ ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`); }
  catch(err){ return startPolling(); }
  SOCKET = ws;
  const giveUp = setTimeout(()=>{ try{ws.close();}catch(e){} }, 4000);
  ws.onopen = ()=>{ clearTimeout(giveUp); conn("ws","live · websocket"); };
  ws.onmessage = m => {
    let payload; try{ payload = JSON.parse(m.data); }catch(e){ return; }
    if(payload.type === "tick"){ header(payload.beat); return; }
    if(!FOLLOW) return;             // reading a past hypothesis
    if(payload.id && payload.stage === "begin"){ EVENTS = []; HYP = payload.id; resetWheel(); }
    ingest(payload);
  };
  ws.onclose = ()=>{ clearTimeout(giveUp); SOCKET=null; startPolling(); };
  ws.onerror  = ()=>{ try{ws.close();}catch(e){} };
}

function header(beat){
  if(!beat) return;
  if(beat.owner) $("#owner").textContent = `· ${beat.owner}`;
  if(beat.iteration!=null && !ACTIVE) $("#hub-big").textContent = `iteration ${beat.iteration}`;
}

async function pollOnce(){
  try{
    const [beat, journal] = await Promise.all([
      fetch("/api/loop",{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),
      fetch(FOLLOW ? "/api/journal" : `/api/journal/${encodeURIComponent(HYP)}`,
            {cache:"no-store"}).then(r=>r.json()).catch(()=>({events:[]})),
    ]);
    header(beat);
    const events = journal.events || [];
    if(journal.id && journal.id !== HYP && FOLLOW){ HYP = journal.id; resetWheel(); EVENTS = []; }
    if(events.length !== EVENTS.length){
      // Replay from the start so a page opened mid-hypothesis is never
      // half-drawn, then apply only the newest for the live box.
      const fresh = events.slice(EVENTS.length);
      EVENTS = events;
      renderJournal();
      for(const e of fresh) apply(e);
      if(!fresh.length && events.length) apply(events[events.length-1]);
    }
    if(SOCKET) return;
    conn("poll", beat && beat.iteration ? "live · polling" : "waiting for the loop");
  }catch(err){ if(!SOCKET) conn("bad","reconnecting"); }
}

function startPolling(){
  if(POLLING) return;
  conn("poll","live · polling");
  pollOnce();
  POLLING = setInterval(()=>{ if(!document.hidden) pollOnce(); }, 2000);
}

/* ---------- picking a past hypothesis ---------- */
async function loadPicker(){
  try{
    const {journals} = await fetch("/api/journals",{cache:"no-store"}).then(r=>r.json());
    const pick = $("#pick");
    pick.innerHTML = `<option value="">live</option>` +
      (journals||[]).map(j=>`<option value="${esc(j.id)}">${esc(j.id)} · ${j.events}</option>`).join("");
  }catch(e){}
}
$("#pick").onchange = async ev => {
  const id = ev.target.value;
  FOLLOW = !id;
  if(FOLLOW){ HYP=null; EVENTS=[]; resetWheel(); return pollOnce(); }
  HYP = id; resetWheel();
  const j = await fetch(`/api/journal/${encodeURIComponent(id)}`,{cache:"no-store"}).then(r=>r.json());
  EVENTS = j.events || [];
  renderJournal();
  // Walk the whole hypothesis so the wheel shows how far it actually got.
  for(const e of EVENTS) apply(e);
};

drawWheel();
chooseTransport();
// Whatever the probe decided, a page with nothing on it after two seconds is a
// broken page. This is the floor, not the plan.
setTimeout(()=>{ if(!SOCKET) startPolling(); }, 2000);
loadPicker();
setInterval(loadPicker, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !SOCKET) pollOnce(); });
</script>
</body>
