<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>QuantLab · Live research</title>
  <style>
    :root{color-scheme:dark;--ink:#06070a;--panel:#10111a;--line:#292c42;--text:#f5f3ff;--muted:#9d9eb2;--violet:#a78bfa;--pink:#f472b6;--coral:#fb7185;--cyan:#22d3ee;--lime:#b6ff5c;--amber:#fbbf24}*{box-sizing:border-box}body{margin:0;background:radial-gradient(850px 330px at 10% -15%,#6d28d92c,transparent 70%),radial-gradient(660px 310px at 94% -5%,#ec489928,transparent 70%),var(--ink);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}main{max-width:1540px;margin:auto;padding:20px 22px 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:13px}.mark{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--pink));box-shadow:0 0 18px var(--violet)}.brand b{font:800 18px system-ui;letter-spacing:-.04em}.brand span{color:var(--muted);font-size:11px}.right{display:flex;align-items:center;gap:14px}.tabs{display:flex;padding:3px;border:1px solid #ffffff18;border-radius:11px;background:#0c0d14}.tab{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font:800 12px system-ui;letter-spacing:.02em;padding:10px 17px;border-radius:8px;cursor:pointer;white-space:nowrap}.tab:hover{color:var(--text)}.tab.active{background:linear-gradient(110deg,var(--violet),var(--pink));color:#170b1e}.tab.best.active{background:linear-gradient(110deg,var(--lime),var(--cyan));color:#08210f}.tab.best:before{content:'★';font-size:12px}.live{color:var(--lime);font-weight:700;white-space:nowrap}.command-deck{display:grid;grid-template-columns:1fr 1fr .85fr 1.3fr .8fr;gap:9px;margin:12px 0}.deck{min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:linear-gradient(135deg,#11121dbd,#090a11d9)}.deck.cluster{border-color:#22d3ee55;background:linear-gradient(135deg,#22d3ee12,#a78bfa12)}.deck.state{border-color:#a78bfa55;background:linear-gradient(135deg,#a78bfa16,#f472b610)}.deck-top{display:flex;align-items:center;gap:7px;color:var(--muted);font:700 10px system-ui;text-transform:uppercase;letter-spacing:.08em}.glyph{display:grid;place-items:center;width:19px;height:19px;border:1px solid #ffffff2a;border-radius:6px;color:var(--cyan);font:700 12px ui-monospace}.deck strong{display:block;font:750 16px system-ui;letter-spacing:-.03em;margin:6px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deck small{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deck a{color:var(--text);text-decoration:none}.deck a:hover strong{color:var(--cyan)}.deck .signal{color:var(--lime)}.deck .working{color:var(--amber)}.activity{display:none}.notice{border:1px solid #fbbf2440;border-left:3px solid var(--amber);border-radius:11px;background:#241708a8;color:#fde68a;padding:11px 14px;margin:12px 0;font-size:12px;line-height:1.5}.deck.best{border-color:#b6ff5c55;background:linear-gradient(135deg,#b6ff5c14,#22d3ee0e);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}.deck.best:hover strong{color:var(--lime)}.deck.best.on{box-shadow:0 0 0 1px #b6ff5c66 inset}.champion{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;border:1px solid #b6ff5c3d;border-radius:14px;padding:13px 16px;background:linear-gradient(120deg,#b6ff5c12,#22d3ee0a)}.champion h1{font:800 18px system-ui;letter-spacing:-.03em;margin:0}.champion.trail{border-color:#ffffff14;background:#0b0c13b8}.champion.trail h1{font-size:14px;color:var(--muted)}.champion.trail .metric{color:var(--text)}.champion .why{color:var(--muted);font-size:11px;margin-top:4px;max-width:640px;line-height:1.5}.champion .facts{display:flex;flex-wrap:wrap;gap:18px}.champion .facts div{min-width:74px}.badge{display:inline-block;border-radius:99px;padding:3px 9px;font:800 10px system-ui;letter-spacing:.06em;vertical-align:middle;margin-left:8px}.badge.forward{background:#b6ff5c1f;border:1px solid #b6ff5c66;color:var(--lime)}.badge.phase1{background:#fbbf241f;border:1px solid #fbbf2466;color:var(--amber)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.overview{grid-column:1/-1;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#17192ab8,#0c0d14e8);padding:15px;box-shadow:0 18px 44px #0003}.overview-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.overview-head h1{font:760 17px system-ui;margin:0;letter-spacing:-.03em}.overview-head span{color:var(--muted);font-size:11px}.timeline{position:relative;height:7px;border-radius:99px;background:#292c42;margin:14px 2px 5px}.timeline-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink));box-shadow:0 0 18px #a78bfa80}.timeline-dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px;border:3px solid var(--panel);background:var(--lime);box-shadow:0 0 16px var(--lime);border-radius:50%}.timecopy{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.hero{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:13px;margin-top:13px}.chart-card,.scorecard,.live-card{border:1px solid #ffffff12;border-radius:12px;background:#090a11b8}.chart-card{padding:13px}.chart-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px}.chart-title h2,.live-card h2{font:700 13px system-ui;margin:0}.chart-title span{color:var(--muted);font-size:11px}canvas{width:100%;height:205px;background:linear-gradient(180deg,#a78bfa10,transparent);border-radius:8px}.scorecard{display:grid;grid-template-columns:1fr 1fr;padding:12px;gap:9px}.scorecard .leadmetric{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:9px}.label{color:var(--muted);font-size:10px}.metric{font:760 20px system-ui;letter-spacing:-.045em;margin-top:3px}.leadmetric .metric{font-size:29px}.good,.ok{color:var(--lime)}.bad{color:var(--coral)}.amber{color:var(--amber)}.livegrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.live-card{padding:13px;min-width:0}.live-card h2{margin-bottom:10px}.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #ffffff0d}.row:first-of-type{border-top:0}.row span{color:var(--muted);font-size:10px}.row b{font-size:11px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event{padding:7px 0;border-top:1px solid #ffffff0d}.event:first-of-type{border-top:0}.event b{display:block;font-size:11px}.event span{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:11px}details{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;background:#10111ab8;overflow:hidden}summary{cursor:pointer;list-style:none;padding:12px 15px;font:700 13px system-ui}summary:after{content:'+';float:right;color:var(--cyan)}details[open] summary:after{content:'−'}details>div{padding:0 15px 15px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.detailgrid h2{font:700 13px system-ui}.table-wrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#1a1c2d;color:var(--muted);font-weight:600}th:first-child,td:first-child{text-align:left}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d8d7ee;font-size:12px;max-height:300px;overflow:auto}.pill{border:1px solid #ffffff22;border-radius:99px;padding:3px 7px;color:var(--muted)}.state{border-color:#a78bfa55;background:linear-gradient(135deg,#a78bfa12,#f472b610)}@media(max-width:900px){.command-deck{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.scorecard{grid-template-columns:repeat(4,1fr)}.scorecard .leadmetric{grid-column:span 2;border-bottom:0}.livegrid{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}}@media(max-width:620px){main{padding:15px 12px 55px}.topbar{align-items:flex-start}.brand span{display:none}.right{align-items:flex-end;flex-direction:column}.tabs{width:100%}.tab{flex:1}.command-deck{grid-template-columns:1fr 1fr}.deck{padding:9px}.deck strong{font-size:14px}canvas{height:180px}.scorecard{grid-template-columns:1fr 1fr}.scorecard .leadmetric{grid-column:1/-1;border-bottom:1px solid var(--line)}.overview-head{display:block}}
  </style>
</head>
<body><main>
  <header class="topbar"><div class="brand"><i class="mark"></i><b>QuantLab</b><span>OPEN AGENT RESEARCH · LONG-ONLY</span></div><div class="right"><nav class="tabs" aria-label="Strategy views"><button id="currentTab" class="tab active">Active testing strategy</button><button id="bestTab" class="tab best">Best strategy</button></nav><div id="live" class="live">● connecting</div></div></header>
  <section id="commandDeck" class="command-deck" aria-label="Live research control deck"></section>
  <div id="activity"></div><div id="notice"></div><section id="app" class="grid"></section>
</main><script>
let data=null,view='current';
const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(v),pct=v=>v==null?'—':(100*Number(v)).toFixed(2)+'%',num=v=>v==null?'—':new Intl.NumberFormat('en-US').format(v),cls=v=>v>0?'good':v<0?'bad':'',duration=s=>s==null?'—':s<86400?(s/3600).toFixed(1)+' h':(s/86400).toFixed(1)+' d',date=v=>v?new Date(v).toLocaleDateString('en-US'):'—',stamp=v=>v?new Date(v).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—',esc=v=>String(v??'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),evidenceLabel=e=>e==='FORWARD_2026'?'2026 FORWARD EVIDENCE':e?'PHASE 1 HISTORICAL EVIDENCE':'NO EVIDENCE YET',evidenceClass=e=>e==='FORWARD_2026'?'forward':'phase1';
function timeline(run){if(!run)return '';const forward=String(run.status).startsWith('FORWARD'),aborted=String(run.status).includes('ABORTED'),start=Date.parse(run.period_start),end=Date.parse(run.period_end),now=Date.parse(run.current_date||run.period_start),progress=Math.max(0,Math.min(100,100*(now-start)/Math.max(1,end-start))),title=forward?'Forward evaluation · 2026':'Historical backtest',state=aborted?'STOPPED AT DRAWDOWN LIMIT':run.status;return `<div class="overview-head"><h1>${title}</h1><span class="${aborted?'bad':''}">${state} · ${run.processed_days}/${run.total_days} days</span></div><div class="timeline"><div class="timeline-fill" style="width:${progress}%"></div><div class="timeline-dot" style="left:${progress}%"></div></div><div class="timecopy"><span>${date(run.period_start)}</span><span>Simulated: ${date(run.current_date)}</span><span>${date(run.period_end)}</span></div>`}
function chart(points){setTimeout(()=>{const c=document.getElementById('equityChart');if(!c||!points?.length)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const a=points.map(p=>p.equity),lo=Math.min(...a),hi=Math.max(...a),r=hi-lo||1,g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#22d3ee');g.addColorStop(.5,'#a78bfa');g.addColorStop(1,'#f472b6');x.strokeStyle=g;x.shadowColor='#a78bfa';x.shadowBlur=12;x.lineWidth=2.5;x.beginPath();a.forEach((v,i)=>{const px=i/(a.length-1||1)*w,py=h-9-(v-lo)/r*(h-18);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()},0)}
function rows(items){return(items||[]).map(x=>`<tr><td>${esc(x.symbol)}</td><td>${money(x.capital_deployed)}</td><td>${money(x.peak_capital_at_risk)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.return_on_deployed)}">${pct(x.return_on_deployed)}</td><td>${x.trades}</td><td>${pct(x.win_rate)}</td></tr>`).join('')};function trades(items){return(items||[]).map(x=>`<tr><td>${esc(x.symbol)} #${x.sequence}</td><td>${date(x.entry_time)}</td><td>${date(x.exit_time)}</td><td>${duration(x.duration_seconds)}</td><td>${money(x.invested_capital)}</td><td class="${cls(x.pnl)}">${money(x.pnl)}</td><td class="${cls(x.pnl_pct)}">${pct(x.pnl_pct)}</td><td><span class="pill">${esc(x.exit_reason)}</span></td></tr>`).join('')};
function livePanels(active,shown){const a=data.activity||{},d=a.details||{},progress=d.progress||{},recent=(active?.trades||shown?.trades||[]).slice(-4).reverse();const phase=esc(a.phase||'WAITING'),message=esc(a.message||'No activity reported');const strategy=active?.label||shown?.label||'Preparing';return `<section class="livegrid"><article class="live-card state"><h2>Strategy workshop</h2><div class="row"><span>Working state</span><b class="amber">${phase}</b></div><div class="row"><span>Current strategy</span><b>${esc(strategy)}</b></div><div class="row"><span>What is happening</span><b title="${message}">${message}</b></div></article><article class="live-card"><h2>Simulation &amp; data</h2><div class="row"><span>Asset / simulated date</span><b>${esc(d.symbol||progress.symbol||date(progress.timestamp)||'Preparing')}</b></div><div class="row"><span>Signal preparation</span><b>${progress.prepared_assets!=null?progress.prepared_assets+'/'+progress.total_assets:'—'}</b></div><div class="row"><span>Data ready</span><b>${data.data_coverage.research_ready}/${data.data_coverage.total}</b></div></article><article class="live-card"><h2>Latest execution trail</h2>${recent.length?recent.map(t=>`<div class="event"><b>${esc(t.symbol)} · ${cls(t.pnl)==='good'?'+':''}${money(t.pnl)}</b><span>${date(t.exit_time)} · ${esc(t.exit_reason)} · ${duration(t.duration_seconds)}</span></div>`).join(''):'<div class="empty">No closed trades yet. The trail appears here as the simulation executes.</div>'}</article></section>`}
function championBanner(s){const c=s.champion||{},forward=c.evidence==='FORWARD_2026';const rule=forward?'Ranked only on completed 2026 forward evidence that stayed under the 25% drawdown limit. It is replaced only by a strictly better forward score.':'No 2026 forward evaluation qualifies yet, so the best completed Phase-1 backtest is published. Historical results are never forward results.';return `<section class="champion"><div><h1>Best strategy · ${esc(s.label)}<span class="badge ${evidenceClass(c.evidence)}">${evidenceLabel(c.evidence)}</span></h1><div class="why">${rule}</div></div><div class="facts"><div><div class="label">Ranking score</div><div class="metric ${cls(c.score)}" style="font-size:20px">${c.score==null?'—':Number(c.score).toFixed(4)}</div></div><div><div class="label">Evaluations beaten</div><div class="metric" style="font-size:20px">${num(c.evaluations_considered)}</div></div><div><div class="label">Published</div><div class="metric" style="font-size:14px">${stamp(c.crowned_at)}</div></div><div><div class="label">Replaced</div><div class="metric" style="font-size:14px">${c.replaced_strategy_number?'S'+String(c.replaced_strategy_number).padStart(5,'0'):'first champion'}</div></div></div></section>`}
function beforeForward(s){const p=s.phase1;if(!p)return '';const score=(p.return_pct!=null&&p.max_drawdown!=null)?(p.return_pct-p.max_drawdown).toFixed(3):'—';return `<section class="champion trail"><div><h1>Before 2026 · ${esc(s.label)} in Phase 1</h1><div class="why">The same strategy over ${date(p.period_start)} → ${date(p.period_end)}, kept as its record. Historical results never rank the champion — only the 2026 evaluation above does.</div></div><div class="facts"><div><div class="label">Final equity</div><div class="metric" style="font-size:17px">${money(p.final_equity)}</div></div><div><div class="label">Return</div><div class="metric ${cls(p.return_pct)}" style="font-size:17px">${pct(p.return_pct)}</div></div><div><div class="label">Drawdown</div><div class="metric bad" style="font-size:17px">${pct(p.max_drawdown)}</div></div><div><div class="label">Trades · win rate</div><div class="metric" style="font-size:17px">${num(p.trades)} · ${pct(p.win_rate)}</div></div><div><div class="label">Score</div><div class="metric" style="font-size:17px">${score}</div></div></div></section>`}
function championPanels(s){const c=s.champion||{},r=s.backtest||{},recent=(s.trades||[]).slice(0,4);return `<section class="livegrid"><article class="live-card state"><h2>Champion record</h2><div class="row"><span>Strategy</span><b>${esc(s.label)}</b></div><div class="row"><span>Signal family</span><b>${esc(s.definition?.family)}</b></div><div class="row"><span>Evidence</span><b class="good">${evidenceLabel(c.evidence)}</b></div><div class="row"><span>Published</span><b>${stamp(c.crowned_at)}</b></div></article><article class="live-card"><h2>2026 execution</h2><div class="row"><span>Assets traded</span><b>${num(r.assets_traded)} of ${num(r.assets_available)}</b></div><div class="row"><span>Winning / losing</span><b>${num(r.wins)} / ${num(r.losses)}</b></div><div class="row"><span>Cash at close</span><b>${money(r.cash)}</b></div><div class="row"><span>Open positions</span><b>${num(r.open_positions)}</b></div></article><article class="live-card"><h2>Latest 2026 trades</h2>${recent.length?recent.map(t=>`<div class="event"><b>${esc(t.symbol)} · ${cls(t.pnl)==='good'?'+':''}${money(t.pnl)}</b><span>${date(t.exit_time)} · ${esc(t.exit_reason)} · ${duration(t.duration_seconds)}</span></div>`).join(''):'<div class="empty">This champion published no closed trades.</div>'}</article></section>`}
function deck(){const a=data.activity||{},d=a.details||{},p=d.progress||{},current=data.current_strategy?.label||data.current?.experiment_id||'Preparing',phase=esc(a.phase||'WAITING'),message=esc(a.message||'Awaiting local worker');const c=data.champion_record||{};const best=c.label||'Not published yet',bestNote=c.evidence?evidenceLabel(c.evidence)+' · score '+Number(c.score).toFixed(3):'Waiting for the first completed evaluation';commandDeck.innerHTML=`<article class="deck state"><div class="deck-top"><i class="glyph">◇</i> active testing strategy</div><strong>${esc(current)}</strong><small>Long-only research candidate</small></article><button id="bestDeck" type="button" class="deck best ${view==='best'?'on':''}"><div class="deck-top"><i class="glyph">★</i> best strategy</div><strong>${esc(best)}</strong><small title="${esc(bestNote)}">${esc(bestNote)}</small></button><article class="deck"><div class="deck-top"><i class="glyph">◌</i> laboratory state</div><strong class="working">${phase}</strong><small title="${message}">${message}</small></article><a class="deck cluster" href="https://meshkore.com/clusters/open-crypto-algo-agents-development" target="_blank" rel="noreferrer"><div class="deck-top"><i class="glyph">↗</i> agent collaboration</div><strong><span class="signal">●</span> Open live messages</strong><small>Codex + Claude · public Wall</small></a><article class="deck"><div class="deck-top"><i class="glyph">▦</i> data coverage</div><strong>${data.data_coverage.research_ready}/${data.data_coverage.total}</strong><small>${esc(d.symbol||p.symbol||'Preparing market data')}</small></article>`}
function overview(s){const r=s?.backtest,badge=s.validated?'<span class="pill good">COMPLETED</span>':'<span class="pill amber">IN PROGRESS</span>';return `<section class="overview">${timeline(r)}<div class="hero"><div class="chart-card"><div class="chart-title"><h2>Portfolio equity</h2><span>${esc(s.label)} ${badge}</span></div>${s.equity_curve?.length?'<canvas id="equityChart"></canvas>':'<div class="empty">Equity points appear as the evaluation progresses.</div>'}</div><aside class="scorecard"><div class="leadmetric"><div class="label">Current equity</div><div class="metric ${cls((r?.current_equity||0)-(r?.initial_capital||0))}">${money(r?.current_equity)}</div></div><div><div class="label">Net P&amp;L</div><div class="metric ${cls(r?.net_profit)}">${money(r?.net_profit)}</div></div><div><div class="label">Drawdown</div><div class="metric bad">${pct(r?.max_drawdown)}</div></div><div><div class="label">Trades</div><div class="metric">${num(r?.trades)}</div></div><div><div class="label">Win rate</div><div class="metric">${pct(r?.win_rate)}</div></div></aside></div></section>`}
function detail(s){const e=s.experiment;return `<details><summary>Strategy, execution and research metrics</summary><div class="detailgrid"><article><h2>Signal criteria</h2><pre>${esc(JSON.stringify({family:s.definition?.family,signal:s.definition?.signal,parameters:e?.parameters},null,2))}</pre></article><article><h2>Execution and risk management</h2><pre>${esc(JSON.stringify({execution:s.definition?.execution,money_management:s.definition?.money_management},null,2))}</pre></article></div></details><details><summary>Asset results · ${s.assets?.length||0} assets</summary><div>${s.assets?.length?`<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Capital</th><th>Peak at risk</th><th>P&amp;L</th><th>Return</th><th>Trades</th><th>Win rate</th></tr></thead><tbody>${rows(s.assets)}</tbody></table></div>`:'<div class="empty">No asset results yet.</div>'}</div></details><details><summary>Trade ledger · ${s.trades?.length||0}</summary><div>${s.trades?.length?`<div class="table-wrap"><table><thead><tr><th>Trade</th><th>Entry</th><th>Exit</th><th>Duration</th><th>Capital</th><th>P&amp;L</th><th>P&amp;L %</th><th>Exit reason</th></tr></thead><tbody>${trades(s.trades)}</tbody></table></div>`:'<div class="empty">This strategy has not produced trades yet.</div>'}</div></details>`}
function renderCurrent(){const active=data.current_strategy,fallback=data.last_completed_strategy;const s=active?.equity_curve?.length||active?.trades?.length||active?.backtest?.processed_days?active:(fallback||active);const a=data.activity||{},p=(a.details||{}).progress||{};notice.innerHTML=fallback&&s===fallback?`<div class="notice"><b>${esc(active?.label||data.current?.experiment_id)}</b> is being prepared right now${p.prepared_assets!=null?' — signals '+p.prepared_assets+'/'+p.total_assets:''}. Everything below belongs to <b>${esc(s.label)}</b>, the last Phase-1 backtest that finished; it stays on screen so the view is never blank between strategies.</div>`:'';if(!s){app.innerHTML=livePanels(active,null);return}app.innerHTML=overview(s)+livePanels(active,s)+detail(s);chart(s.equity_curve)}
function renderBest(){const s=data.best_strategy;notice.innerHTML=data.warning?`<div class="notice">${esc(data.warning)}</div>`:'';if(!s){app.innerHTML='<section class="livegrid"><article class="live-card state"><h2>Best strategy</h2><div class="empty">No completed evaluation is eligible yet. The laboratory publishes the winner here — chart, metrics, assets and trade ledger — as soon as one backtest finishes under the 25% drawdown limit.</div></article></section>';return}app.innerHTML=championBanner(s)+overview(s)+championPanels(s)+beforeForward(s)+detail(s);chart(s.equity_curve)}
function render(){if(!data)return;currentTab.classList.toggle('active',view==='current');bestTab.classList.toggle('active',view==='best');view==='best'?renderBest():renderCurrent()}
function show(next){view=next;deck();render()}
async function refresh(){try{data=await fetch('/api/dashboard',{cache:'no-store'}).then(r=>r.json());live.textContent='● live · '+new Date(data.service.updated_at).toLocaleTimeString('en-US');deck();render()}catch{live.textContent='● reconnecting';live.className='bad'}}
currentTab.onclick=()=>show('current');bestTab.onclick=()=>show('best');commandDeck.onclick=event=>{if(event.target.closest('#bestDeck'))show('best')};refresh();setInterval(refresh,3000);
</script></body></html>
