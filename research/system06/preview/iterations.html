<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>System 06 · Todas las iteraciones</title>
<style>
:root{
  --bg:#0a0d13; --panel:#111624; --panel2:#0e1320; --line:#1e2636; --line2:#2a3550;
  --ink:#e8edf6; --dim:#8a97ad; --mute:#5f6c82;
  --up:#26c281; --upbg:rgba(38,194,129,.13); --down:#ec5b6a; --downbg:rgba(236,91,106,.12);
  --accent:#4b8cff; --accentbg:rgba(75,140,255,.14); --warn:#e8b34a;
  --radius:12px; --r2:9px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
#top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141d2b,#10161f);padding:18px 22px}
#top h1{margin:0 0 4px;font-size:19px}
#top p{margin:0;color:var(--dim);font-size:13px;max-width:90ch}
#wrap{max-width:1180px;margin:0 auto;padding:18px 22px 60px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel2);color:var(--dim);text-align:left;
   font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr.row:hover td{background:var(--panel)}
td.hyp{white-space:normal;color:var(--dim);max-width:46ch}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mute)}
.b2026{font-weight:700}
.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);
     padding:3px 10px;color:var(--ink);font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
tr.detail td{background:var(--panel2);white-space:normal;padding:12px 16px}
.years{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.yr{border:1px solid var(--line2);border-radius:var(--r2);padding:3px 9px;font-size:12px;background:var(--panel)}
.yr b{margin-left:6px}
.meta{color:var(--mute);font-size:12px}
#foot{color:var(--mute);font-size:12px;margin-top:14px}
.badge{display:inline-block;border-radius:var(--r2);padding:1px 8px;font-size:11px;font-weight:600}
.badge.ok{background:var(--upbg);color:var(--up)}
.badge.err{background:var(--downbg);color:var(--down)}
</style>
</head>
<body>
<div id="top">
  <h1>Todas las iteraciones</h1>
  <p>El registro completo del laboratorio, de la más reciente a la primera. Cada fila es un
     backtest real del bucle autónomo; <b>2026</b> es el año sellado — nunca se entrena ni se
     selecciona con él. <a href="/">← Volver al panel</a></p>
</div>
<div id="wrap">
  <table id="tbl">
    <thead><tr>
      <th>Fecha</th><th>Iteración</th><th>Hipótesis</th>
      <th>2026 (sellado)</th><th>Score</th><th>Peor año</th><th>CAGR</th><th></th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="8" class="meta">Cargando…</td></tr></tbody>
  </table>
  <div id="foot"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const pct=(v,dec=1)=>v==null?"—":((v>0?"+":"")+(100*v).toFixed(dec)+"%");
const cls=v=>v==null?"flat":(v>0?"up":(v<0?"down":"flat"));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let ROWS=[];
function fw(r){ // sealed-2026 return of a row, wherever it lives
  if(r.forward_2026 && r.forward_2026.return_pct!=null) return +r.forward_2026.return_pct;
  if(r.annual && r.annual["2026"]!=null) return +r.annual["2026"];
  return null;
}
function render(){
  const tb=$("#rows");
  tb.innerHTML = ROWS.map((r,i)=>{
    const f=fw(r), d=(r.at||"").slice(0,16).replace("T"," ");
    const bad=r.error?`<span class="badge err">error</span>`:"";
    return `<tr class="row" id="r${i}">
      <td class="meta">${esc(d)}</td>
      <td>#${esc(r.iteration??"—")} ${bad}</td>
      <td class="hyp">${esc(r.hypothesis||r.rationale||"—")}</td>
      <td class="b2026 ${cls(f)}">${pct(f,2)}</td>
      <td class="${cls(r.score)}">${r.score==null?"—":(+r.score).toFixed(4)}</td>
      <td class="${cls(r.min_year)}">${pct(r.min_year)}</td>
      <td class="${cls(r.cagr)}">${pct(r.cagr,0)}</td>
      <td><button class="btn" onclick="toggle(${i})">Detalle</button></td>
    </tr>`;
  }).join("");
  $("#foot").textContent = `${ROWS.length} iteraciones · página generada por el laboratorio autónomo`;
}
function toggle(i){
  const open=document.getElementById("d"+i);
  if(open){ open.remove(); return; }
  document.querySelectorAll("tr.detail").forEach(e=>e.remove());
  const r=ROWS[i], anchor=document.getElementById("r"+i);
  const years=Object.keys(r.annual||{}).sort();
  const ys=years.map(y=>{
    const v=+r.annual[y];
    return `<span class="yr">${y}${y==="2026"?" 🔒":""}<b class="${cls(v)}">${pct(v)}</b></span>`;
  }).join("")||`<span class="meta">sin desglose anual</span>`;
  const f=r.forward_2026||{};
  const extra=[
    f.max_drawdown!=null?`maxDD 2026 ${(100*f.max_drawdown).toFixed(1)}%`:null,
    f.trades!=null?`${f.trades} trades en 2026`:null,
    r.all_positive!=null?(r.all_positive?"todos los años research en verde":"algún año research en rojo"):null,
    r.seconds!=null?`${Math.round(r.seconds/60)} min de cómputo`:null,
    r.error?`ERROR: ${esc(r.error)}`:null,
  ].filter(Boolean).join(" · ");
  const tr=document.createElement("tr");
  tr.className="detail"; tr.id="d"+i;
  tr.innerHTML=`<td colspan="8">
     <div class="years">${ys}</div>
     ${r.rationale?`<div class="meta" style="max-width:100ch">${esc(r.rationale)}</div>`:""}
     <div class="meta">${extra||""}</div></td>`;
  anchor.after(tr);
}
fetch("/api/iterations").then(r=>r.json()).then(d=>{ROWS=d.rows||[];render();})
  .catch(()=>{$("#rows").innerHTML=`<tr><td colspan="8" class="meta">No se pudo cargar el histórico.</td></tr>`;});
</script>
</body>
</html>
