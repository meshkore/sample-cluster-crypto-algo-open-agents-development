<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantLab · the loop, live</title>
<meta name="description" content="The research loop as it runs: seven stages in a circle, lit as the orchestrator walks them, with every event it produces.">
<style>
:root{
  --bg:#0b0f14; --panel:#121822; --panel-2:#182031; --line:#233047;
  --ink:#e8eef7; --muted:#8ba0bd; --dim:#5c718f;
  --up:#3fd18b; --down:#ff6b6b; --live:#ffb454; --accent:#5aa9ff;
  --seal:#c792ea; --radius:10px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ---------- the thin bar ---------- */
#bar{
  display:flex; align-items:center; gap:12px; padding:8px 16px;
  border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;
}
#bar a.home{color:var(--muted); text-decoration:none; font-weight:600; font-size:14px}
#bar a.home:hover{color:var(--ink)}
#bar .sep{color:var(--dim)}
#bar h1{margin:0; font-size:14px; font-weight:600; letter-spacing:.02em}
#bar .who{color:var(--dim); font-size:13px}
#bar #conn{margin-left:auto; font-size:12.5px; color:var(--muted); white-space:nowrap}
#bar #conn::before{content:"●"; margin-right:5px; color:var(--dim)}
#bar #conn.ws::before{color:var(--up)}
#bar #conn.poll::before{color:var(--live)}
#bar #conn.bad::before{color:var(--down)}

/* ---------- the two panes ---------- */
#panes{display:grid; grid-template-columns:minmax(0,1fr) 440px; flex:1; min-height:0}
@media (max-width:1100px){ #panes{grid-template-columns:1fr; grid-template-rows:1fr 320px} }

/* The diagram is a SQUARE. It is a cycle, and a cycle drawn wide is a racetrack
   -- the shape itself is the thing that says "this comes back to the start". */
#stage{
  min-width:0; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:18px; overflow:hidden;
}
#square{width:100%; height:100%; position:relative}
svg{width:100%; height:100%; display:block; overflow:visible}

/* Type. The diagram renders at roughly 0.9 of its own units on a 16-inch
   laptop, so nothing here is below 14 — which lands at 12.5px on screen and
   is the floor for something meant to be read across a room. The old ring
   forced 9.5px labels because a circle gives a box no straight edge to fill. */
.flow{fill:none; stroke:#3d5279; stroke-width:2.5; stroke-linecap:round}
.flow.on{stroke:var(--live); stroke-dasharray:6 10; animation:march 1.1s linear infinite}
.flow.back{stroke:#4a3a1c; stroke-dasharray:2 7}
.flow.back.on{stroke:var(--live); stroke-dasharray:6 10}
@keyframes march{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){ .flow.on{animation:none; stroke-dasharray:none} }

.backlabel{
  font:600 14px/1 var(--mono); fill:#6b5730; letter-spacing:.04em;
  transition:fill .25s;
}
.backlabel.on{fill:var(--live)}

.node rect{
  fill:var(--panel); stroke:var(--line); stroke-width:1.5; rx:12;
  transition:fill .25s, stroke .25s;
}
.node .n{
  font:700 14px/1 var(--mono); letter-spacing:.13em; text-transform:uppercase;
  fill:var(--dim); transition:fill .25s;
}
.node .t{font:600 18px/1.2 ui-sans-serif,system-ui; fill:var(--ink)}
.node .s{font:15px/1.35 ui-sans-serif,system-ui; fill:var(--muted)}
.node.done rect{stroke:#2f6b50}
.node.done .n{fill:var(--up)}
.node.on rect{fill:#241d10; stroke:var(--live); stroke-width:3}
.node.on .n{fill:var(--live)}
/* FORWARD is the sealed window. It is the one box that is never fitted
   against, so it never shares the working colour. */
.node.seal.on rect{fill:#20172b; stroke:var(--seal)}
.node.seal.on .n{fill:var(--seal)}
.node.seal.done rect{stroke:#5b3f78}
.node.seal.done .n{fill:var(--seal)}

/* The middle of the rectangle: what is being tried, and how far in. Straight
   runs leave this space free, which a ring never did. */
.hub .id{font:700 17px/1 var(--mono); fill:var(--ink); letter-spacing:.06em}
.hub .cap{font:700 15px/1 var(--mono); letter-spacing:.16em; fill:var(--dim); text-transform:uppercase}
.hub .claim{font:16px/1.4 ui-sans-serif,system-ui; fill:var(--muted)}
.hub .big{font:700 36px/1 ui-sans-serif,system-ui; fill:var(--ink)}

/* ---------- the journal ---------- */
#journal{
  border-left:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; min-height:0; min-width:0;
}
@media (max-width:1100px){ #journal{border-left:0; border-top:1px solid var(--line)} }
#jhead{
  padding:10px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:9px; flex:0 0 auto;
}
#jhead h2{
  margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.11em;
  color:var(--dim); font-weight:700;
}
#jhead select{
  font:inherit; font-size:12.5px; background:var(--panel-2); color:var(--ink);
  border:1px solid var(--line); border-radius:6px; padding:3px 6px; max-width:140px;
}
#jhead .count{
  margin-left:auto; color:var(--dim); font-size:10px; font-weight:600;
  background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:12px;
}
#jlist{overflow-y:auto; flex:1; min-height:0; padding:6px 0 40px}
.ev{padding:7px 14px; border-bottom:1px solid #1a2331; display:grid; gap:3px}
.ev:hover{background:var(--panel-2)}
.ev .h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.ev .at{font:12px var(--mono); color:var(--dim); flex:0 0 auto}
.ev .st{
  font:700 12px var(--mono); letter-spacing:.08em; text-transform:uppercase;
  border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:var(--muted);
}
.ev.k-frame .st,.ev.k-consult .st{color:var(--accent); border-color:#28456e}
.ev.k-fit .st{color:var(--live); border-color:#4a3a1c}
.ev.k-forward .st{color:var(--seal); border-color:#5b3f78}
.ev.k-record .st{color:var(--up); border-color:#2f6b50}
.ev .say{color:var(--ink); font-size:14px}
.ev .kv{font:12.5px/1.5 var(--mono); color:var(--muted); word-break:break-word; white-space:pre-wrap}
.ev .kv b{color:var(--ink); font-weight:600}
.empty{color:var(--dim); font-size:13px; padding:20px 14px; text-align:center}
</style>
</head>
<body>

<div id="bar">
  <a class="home" href="/">← QuantLab</a>
  <span class="sep">·</span>
  <h1>The loop, live</h1>
  <span class="who" id="owner"></span>
  <div id="conn">connecting…</div>
</div>

<div id="panes">
  <div id="stage"><div id="square"><svg id="wheel" viewBox="0 0 1000 1000" role="img"
      aria-label="The research loop as seven stages in a circle"></svg></div></div>

  <div id="journal">
    <div id="jhead">
      <h2>Journal</h2>
      <select id="pick" aria-label="Which hypothesis"></select>
      <span class="count" id="jcount">0</span>
    </div>
    <div id="jlist"><div class="empty">Waiting for the loop.</div></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v==null ? "—" : (v*100).toFixed(2)+"%";

/* ---------- the ten stages, on a rectangle ----------

   Ten, not seven. The doc's seven are the phases of a hypothesis; these are the
   places the loop can BE, and three of them were hidden inside one box:
   running a backtest, scoring a finished generation, and putting the result up
   against the gate are different things, and the loop turns back between the
   first two hundreds of times an hour.

   A rectangle rather than a circle. A ring forces every box onto a tangent, so
   the text inside had to shrink to fit a shape that was never carrying any
   meaning -- the cycle is the arrows, not the outline. Straight runs give each
   box the same width, put the type at one size, and leave the middle free for
   what is actually being tried.

   COMPOSE is deliberately not "write the code". This loop cannot write code. It
   composes expression trees over the 79 served columns -- data, validated by
   the grammar before anything runs them -- and calling that "writing code"
   would misdescribe the one guarantee that makes an unattended loop safe. */
const NODES = [
  {key:"frame",    name:"Frame",    title:"Which module is losing money", col:0, row:0,
   note:"Reads the last run's profit and loss per module. The target is arithmetic, never a guess."},
  {key:"consult",  name:"Consult",  title:"Ask the cluster and the advisors", col:1, row:0,
   note:"Posts the hypothesis publicly, reads the replies, asks the proposer — which on an exploration turn may search the open web."},
  {key:"compose",  name:"Compose",  title:"Build the population", col:2, row:0,
   note:"The incumbent, plus the seed rules that survived the grammar, plus invented expression trees. Rules are data, not code."},
  {key:"search",   name:"Search",   title:"Backtest a candidate", col:3, row:0,
   note:"One genome over one fold, every window ending on or before 2025-12-31. Hundreds of these make one answer."},
  {key:"evaluate", name:"Evaluate", title:"Score the generation", col:3, row:1,
   note:"Scores the population across four disjoint folds, then breeds the next generation from what survived."},
  {key:"gate",     name:"Decide",   title:"Better than this module's best?", col:3, row:2,
   note:"The verdict is settled here, on the folds, before the sealed window is touched. If it does not clear, 2026 is never opened."},
  {key:"train",    name:"Train",    title:"Run the accepted genome", col:2, row:2,
   note:"One run over the fittable years, which is what the next iteration's diagnosis will read."},
  {key:"forward",  name:"Forward",  title:"Open 2026, once", col:1, row:2, seal:true,
   note:"One shot at the sealed year, recorded whatever it says, and never fed back into anything."},
  {key:"observe",  name:"Observe",  title:"Which module earned it", col:0, row:2,
   note:"Attributes the 2026 result to the modules and exits that produced it."},
  {key:"record",   name:"Record",   title:"Ledger, cluster, incumbent", col:0, row:1,
   note:"Appends to the append-only ledger, posts the result, moves the incumbent or does not. Then back to Frame."},
];
const INDEX = Object.fromEntries(NODES.map((n,i)=>[n.key,i]));

/* Geometry. Four columns, three rows, boxes only on the perimeter, walked
   clockwise from the top left: right along the top, down the right, left along
   the bottom, up the left, back to the start. */
const VW=1420, VH=980, BW=292, BH=150;
const COLX=[160, 487, 813, 1140], ROWY=[96, 470, 844];
const LANE=655;                       // the empty band the shortcut runs through
const at = i => ({x: COLX[NODES[i].col], y: ROWY[NODES[i].row]});
const edge = (i, side) => {
  const p = at(i);
  if(side==="l") return {x:p.x-BW/2, y:p.y};
  if(side==="r") return {x:p.x+BW/2, y:p.y};
  if(side==="t") return {x:p.x, y:p.y-BH/2};
  return {x:p.x, y:p.y+BH/2};
};

/* The forward path: nine legs around the rectangle, plus the tenth that closes
   it. Each is its own element so one leg can light on its own. */
const LEGS = [
  {from:"frame",    to:"consult",  a:"r", b:"l"},
  {from:"consult",  to:"compose",  a:"r", b:"l"},
  {from:"compose",  to:"search",   a:"r", b:"l"},
  {from:"search",   to:"evaluate", a:"b", b:"t"},
  {from:"evaluate", to:"gate",     a:"b", b:"t"},
  {from:"gate",     to:"train",    a:"l", b:"r"},
  {from:"train",    to:"forward",  a:"l", b:"r"},
  {from:"forward",  to:"observe",  a:"l", b:"r"},
  {from:"observe",  to:"record",   a:"t", b:"b"},
  {from:"record",   to:"frame",    a:"t", b:"b"},
];

/* The two places the loop goes BACKWARDS, which is most of what it does.

   `breed` is the genetic search: score a generation, breed the next, run them
   all again. It fires hundreds of times per hypothesis and is the answer to
   "does this thing adjust its values or fire once and stop".

   `refuted` is the branch that skips the sealed window entirely. A fit that
   does not clear its module's best never earns a 2026 run, so the loop steps
   straight from Decide to Record and starts again -- and a diagram that only
   ever drew the happy path would show a year being spent that was not. */
const BACKS = [
  {key:"breed", from:"evaluate", to:"search", label:"breed the next generation", stack:true,
   path(){ const a=edge(INDEX.evaluate,"r"), b=edge(INDEX.search,"r");
           return `M${a.x},${a.y} C${a.x+112},${a.y} ${b.x+112},${b.y} ${b.x},${b.y}`; },
   at(){ return {x:VW-8, y:(ROWY[0]+ROWY[1])/2 - 18}; }},
  {key:"refuted", from:"gate", to:"record", label:"refuted · 2026 never opened",
   path(){ const a=edge(INDEX.gate,"t"), b=edge(INDEX.record,"b");
           return `M${a.x},${a.y} L${a.x},${LANE} L${b.x},${LANE} L${b.x},${b.y}`; },
   at(){ return {x:(COLX[0]+COLX[3])/2, y:LANE-16}; }},
];

function wrap(text, chars, max){
  const words=String(text||"").split(/\s+/), lines=[]; let line="";
  for(const w of words){
    if((line+" "+w).trim().length > chars){ lines.push(line.trim()); line=w; }
    else line += " "+w;
    if(lines.length>=max) break;
  }
  if(line.trim() && lines.length<max) lines.push(line.trim());
  if(lines.length===max && words.join(" ").length > lines.join(" ").length+1){
    lines[max-1] = lines[max-1].replace(/[.,;:]?$/,"") + "…";
  }
  return lines;
}

function drawWheel(){
  const svg = $("#wheel");
  svg.setAttribute("viewBox", `0 0 ${VW} ${VH}`);
  const parts = [];

  for(let i=0;i<LEGS.length;i++){
    const L = LEGS[i];
    const a = edge(INDEX[L.from], L.a), b = edge(INDEX[L.to], L.b);
    parts.push(`<path class="flow" id="leg-${i}" d="M${a.x},${a.y} L${b.x},${b.y}" marker-end="url(#head)"/>`);
  }
  for(const B of BACKS){
    const m = B.at();
    parts.push(`<path class="flow back" id="back-${B.key}" d="${B.path()}" marker-end="url(#headback)"/>`);
    const lines = B.stack ? wrap(B.label, 11, 3) : [B.label];
    parts.push(`<text class="backlabel" id="backlabel-${B.key}" x="${m.x}" y="${m.y}"
        text-anchor="${B.stack?"end":"middle"}">${lines.map((l,j)=>
          `<tspan x="${m.x}" dy="${j?19:0}">${j?"":"↺ "}${esc(l)}</tspan>`).join("")}</text>`);
  }

  for(let i=0;i<NODES.length;i++){
    const n = NODES[i], p = at(i);
    const x = p.x - BW/2, y = p.y - BH/2;
    parts.push(`<g class="node${n.seal?" seal":""}" id="node-${n.key}">
      <rect x="${x}" y="${y}" width="${BW}" height="${BH}"/>
      <text class="n" x="${x+18}" y="${y+30}">${i+1} · ${esc(n.name)}</text>
      <text class="t" x="${x+18}" y="${y+56}">${esc(n.title)}</text>
      <text class="s" id="say-${n.key}" x="${x+18}" y="${y+83}"></text>
    </g>`);
  }

  const HX = (COLX[0]+COLX[3])/2, HY = ROWY[1] - 40;
  svg.innerHTML = `<defs>
      <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#3d5279"/>
      </marker>
      <marker id="headback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#4a3a1c"/>
      </marker>
    </defs>
    ${parts.join("")}
    <g class="hub">
      <text class="cap" x="${HX}" y="${HY-92}" text-anchor="middle">Hypothesis</text>
      <text class="id"  x="${HX}" y="${HY-62}" text-anchor="middle" id="hub-id">—</text>
      <text class="big" x="${HX}" y="${HY-14}" text-anchor="middle" id="hub-big">idle</text>
      <text class="claim" x="${HX}" y="${HY+22}" text-anchor="middle" id="hub-c1"></text>
      <text class="claim" x="${HX}" y="${HY+45}" text-anchor="middle" id="hub-c2"></text>
      <text class="claim" x="${HX}" y="${HY+68}" text-anchor="middle" id="hub-c3"></text>
    </g>`;

  for(const n of NODES) setSay(n.key, n.note);
}

function setSay(key, text){
  const el = document.getElementById(`say-${key}`);
  if(!el) return;
  const i = INDEX[key];
  const lines = wrap(text || NODES[i].note, 33, 3);
  const x = at(i).x - BW/2 + 18;
  el.innerHTML = lines.map((l,j)=>
    `<tspan x="${x}" dy="${j?22:0}">${esc(l)}</tspan>`).join("");
}

/* ---------- state ---------- */
let ACTIVE = null;          // the node lit right now
const SEEN = new Set();     // nodes this hypothesis has already walked
let HYP = null;             // the hypothesis on screen
let EVENTS = [];            // its journal
let FOLLOW = true;          // follow the loop, unless the reader picked a past one

/* Which arrow is moving, including the ones that go backwards.

   `back` is the whole point of the redraw: when the search scores a generation
   it does not advance, it returns to Search and runs the next one, and when a
   fit fails its gate it does not open 2026 at all -- it steps sideways to
   Record. Both were happening and neither was drawn, so the picture showed a
   loop that walks forward for an hour, which is not what this does. */
function light(node, back){
  if(!INDEX.hasOwnProperty(node)) return;
  ACTIVE = node; SEEN.add(node);
  for(const n of NODES){
    const el = document.getElementById(`node-${n.key}`);
    el.classList.toggle("on", n.key===node);
    el.classList.toggle("done", n.key!==node && SEEN.has(n.key));
  }
  for(let i=0;i<LEGS.length;i++){
    // The forward leg out of the live box, unless the loop is going back.
    document.getElementById(`leg-${i}`).classList.toggle(
      "on", !back && LEGS[i].from === node);
  }
  for(const B of BACKS){
    const lit = back === B.key;
    document.getElementById(`back-${B.key}`).classList.toggle("on", lit);
    document.getElementById(`backlabel-${B.key}`).classList.toggle("on", lit);
  }
}

function resetWheel(){
  SEEN.clear(); ACTIVE=null;
  for(const n of NODES){
    const el = document.getElementById(`node-${n.key}`);
    el.classList.remove("on","done");
    setSay(n.key, n.note);
  }
  for(let i=0;i<LEGS.length;i++) document.getElementById(`leg-${i}`).classList.remove("on");
  for(const B of BACKS){
    document.getElementById(`back-${B.key}`).classList.remove("on");
    document.getElementById(`backlabel-${B.key}`).classList.remove("on");
  }
}

/* What a box says while it is working. Written from the event's own payload, so
   it is what happened rather than a label for what usually happens. */
function sayFor(e){
  const n = e.node, s = e.stage;
  if(s==="frame")      return e.why || e.say;
  if(s==="consulting") return "Posting the hypothesis and reading replies…";
  if(s==="consulted"){
    const bits = [];
    if(e.seed_rules && e.seed_rules.length) bits.push(`${e.seed_rules.length} seed rules survived the grammar`);
    if(e.peers) bits.push(`${e.peers} peer replies`);
    if(e.web) bits.push("proposer searched the web");
    return bits.join(" · ") || e.detail || e.say;
  }
  if(s==="fit")        return `Generation ${e.generation ?? "?"} of ${e.of ?? "?"} scored · best ${e.best!=null?Number(e.best).toFixed(4):"—"} — breeding the next`;
  if(s==="backtest")   return `Backtest ${e.backtests ?? "?"}${e.planned?` of ~${e.planned}`:""} · fold ${e.fold ?? "?"}/${e.folds ?? "?"} · ${pct(e.return_pct)}`;
  if(s==="fitted")     return `Fit score ${e.score!=null?Number(e.score).toFixed(4):"—"} — against this module's best`;
  if(s==="trained")    return `Training ${pct(e.return_pct)} on ${e.trades ?? 0} trades`;
  if(s==="observed")   return String(e.detail || "attributing the 2026 result").slice(0,200);
  if(s==="opening")    return "The sealed window is opening on this fit";
  if(s==="forward")    return `2026: ${pct(e.return_pct)} on ${e.trades ?? 0} trades`;
  if(s==="recorded")   return `Verdict: ${e.verdict || "—"} — back to Frame`;
  if(s==="error")      return String(e.detail || "an iteration failed").slice(0,160);
  return e.say || s;
}

function apply(e){
  if(!e || !e.node) return;
  if(e.iteration!=null) $("#hub-big").textContent = `iteration ${e.iteration}`;
  const id = e.id || HYP;
  if(id && id !== HYP){ HYP = id; resetWheel(); }
  if(HYP) $("#hub-id").textContent = HYP;
  /* Backwards, or on? A scored generation returns to Search; a fit that failed
     its gate goes to Record without ever opening 2026. Anything else is the
     loop moving on, so the forward leg lights instead. */
  let back = null;
  if(e.stage === "fit") back = "breed";
  if(e.stage === "recorded" && !SEEN.has("forward")) back = "refuted";
  light(e.node, back);
  setSay(e.node, sayFor(e));
  if(e.stage === "consulted" && e.claim){
    const lines = wrap(e.claim, 34, 3);
    ["hub-c1","hub-c2","hub-c3"].forEach((el,i)=>
      document.getElementById(el).textContent = lines[i] || "");
  }
  if(e.stage === "begin"){
    ["hub-c1","hub-c2","hub-c3"].forEach(el => document.getElementById(el).textContent = "");
  }
}

/* ---------- the journal ---------- */
const HIDE = new Set(["at","iteration","stage","node","say"]);
function evHTML(e){
  const rest = Object.entries(e)
    .filter(([k,v]) => !HIDE.has(k) && v!=null && v!=="" && !(Array.isArray(v)&&!v.length))
    .map(([k,v]) => `<b>${esc(k)}</b> ${esc(typeof v==="object" ? JSON.stringify(v) : v)}`)
    .join("\n");
  return `<div class="ev k-${esc(e.node||"record")}">
    <div class="h">
      <span class="at">${esc(String(e.at||"").slice(11,19))}</span>
      <span class="st">${esc(e.stage||"")}</span>
    </div>
    <div class="say">${esc(sayFor(e))}</div>
    ${rest?`<div class="kv">${rest}</div>`:""}
  </div>`;
}

function renderJournal(){
  const list = $("#jlist");
  $("#jcount").textContent = EVENTS.length;
  if(!EVENTS.length){ list.innerHTML = '<div class="empty">No events for this hypothesis yet.</div>'; return; }
  const stuck = list.scrollTop + list.clientHeight >= list.scrollHeight - 40;
  list.innerHTML = EVENTS.map(evHTML).join("");
  // Follow the tail, unless the reader has scrolled up to read something.
  if(stuck) list.scrollTop = list.scrollHeight;
}

function ingest(e){
  EVENTS.push(e);
  renderJournal();
  apply(e);
}

/* ---------- transport ----------

   A WebSocket when the page is served by the local daemon, which tails the
   journal and pushes each line as the loop writes it. The public mirror is a
   Cloudflare Worker in front of R2 and receives snapshots rather than holding a
   socket open to this machine, so there the same events arrive by polling. The
   page does not care which it got: both deliver journal events in order. */
let SOCKET = null, POLLING = null;

function conn(kind, text){
  const el = $("#conn");
  el.className = kind;
  el.textContent = text;
}

/* Ask whether a socket is even possible before opening one.

   `/health` is served by the daemon and by nothing else: the public mirror is a
   Worker in front of R2 that receives pushed snapshots, and by design nothing
   on the internet may open a connection back to the laboratory. So on the
   public site a WebSocket attempt cannot succeed, and attempting it anyway put
   a failed-handshake error in every visitor's console before the page quietly
   fell back to what it was always going to use. Probing first is not a
   workaround; it is the page asking which of two architectures it is in. */
async function chooseTransport(){
  let socketed = false;
  try{
    const r = await fetch("/health", {cache:"no-store"});
    socketed = r.ok && (await r.json()).websocket === true;
  }catch(err){ socketed = false; }
  if(socketed) openSocket(); else startPolling();
}

function openSocket(){
  let ws;
  try{ ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`); }
  catch(err){ return startPolling(); }
  SOCKET = ws;
  const giveUp = setTimeout(()=>{ try{ws.close();}catch(e){} }, 4000);
  ws.onopen = ()=>{ clearTimeout(giveUp); conn("ws","live · websocket"); };
  ws.onmessage = m => {
    let payload; try{ payload = JSON.parse(m.data); }catch(e){ return; }
    if(payload.type === "tick"){ header(payload.beat); return; }
    if(!FOLLOW) return;             // reading a past hypothesis
    if(payload.id && payload.stage === "begin"){ EVENTS = []; HYP = payload.id; resetWheel(); }
    ingest(payload);
  };
  ws.onclose = ()=>{ clearTimeout(giveUp); SOCKET=null; startPolling(); };
  ws.onerror  = ()=>{ try{ws.close();}catch(e){} };
}

function header(beat){
  if(!beat) return;
  if(beat.owner) $("#owner").textContent = `· ${beat.owner}`;
  if(beat.iteration!=null && !ACTIVE) $("#hub-big").textContent = `iteration ${beat.iteration}`;
}

async function pollOnce(){
  try{
    const [beat, journal] = await Promise.all([
      fetch("/api/loop",{cache:"no-store"}).then(r=>r.json()).catch(()=>({})),
      fetch(FOLLOW ? "/api/journal" : `/api/journal/${encodeURIComponent(HYP)}`,
            {cache:"no-store"}).then(r=>r.json()).catch(()=>({events:[]})),
    ]);
    header(beat);
    const events = journal.events || [];
    if(journal.id && journal.id !== HYP && FOLLOW){ HYP = journal.id; resetWheel(); EVENTS = []; }
    if(events.length !== EVENTS.length){
      // Replay from the start so a page opened mid-hypothesis is never
      // half-drawn, then apply only the newest for the live box.
      const fresh = events.slice(EVENTS.length);
      EVENTS = events;
      renderJournal();
      for(const e of fresh) apply(e);
      if(!fresh.length && events.length) apply(events[events.length-1]);
    }
    if(SOCKET) return;
    conn("poll", beat && beat.iteration ? "live · polling" : "waiting for the loop");
  }catch(err){ if(!SOCKET) conn("bad","reconnecting"); }
}

function startPolling(){
  if(POLLING) return;
  conn("poll","live · polling");
  pollOnce();
  POLLING = setInterval(()=>{ if(!document.hidden) pollOnce(); }, 2000);
}

/* ---------- picking a past hypothesis ---------- */
async function loadPicker(){
  try{
    const {journals} = await fetch("/api/journals",{cache:"no-store"}).then(r=>r.json());
    const pick = $("#pick");
    pick.innerHTML = `<option value="">live</option>` +
      (journals||[]).map(j=>`<option value="${esc(j.id)}">${esc(j.id)} · ${j.events}</option>`).join("");
  }catch(e){}
}
$("#pick").onchange = async ev => {
  const id = ev.target.value;
  FOLLOW = !id;
  if(FOLLOW){ HYP=null; EVENTS=[]; resetWheel(); return pollOnce(); }
  HYP = id; resetWheel();
  const j = await fetch(`/api/journal/${encodeURIComponent(id)}`,{cache:"no-store"}).then(r=>r.json());
  EVENTS = j.events || [];
  renderJournal();
  // Walk the whole hypothesis so the wheel shows how far it actually got.
  for(const e of EVENTS) apply(e);
};

drawWheel();
chooseTransport();
// Whatever the probe decided, a page with nothing on it after two seconds is a
// broken page. This is the floor, not the plan.
setTimeout(()=>{ if(!SOCKET) startPolling(); }, 2000);
loadPicker();
setInterval(loadPicker, 30000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !SOCKET) pollOnce(); });
</script>
</body>
</html>
