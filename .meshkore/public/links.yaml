version: 1
modules:
  - id: quantlab
    local:
      url: http://127.0.0.1:8766
      command: "PYTHONPATH=src python3 -m quantlab daemon"
      health: /api/dashboard
    prod:
      url: https://quantlab-public-mirror.rjj.workers.dev
      provider: cloudflare
      project: quantlab-public-mirror
      region: global
      deploy_command: "cd cloudflare/public-mirror && sh sync-ui.sh && npx wrangler deploy"
      deployed_version: "0.2.0"
      deployed_at: 2026-08-02T09:32:00Z
      deployed_by: claude-code-developer
    repo:
      branch: main
      version: "0.2.0"
    notes: "Cloudflare Worker + R2. Permanent workers.dev address. The Mac pushes
      a redacted snapshot outbound every 5s behind a bearer token; no inbound
      path to the origin exists."
